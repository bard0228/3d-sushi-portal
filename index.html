<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>壽司傳送門 - 3D Stencil Portal</title>
  <!-- PWA & Mobile App Support -->
  <link rel=manifest href=manifest.json />
  <meta name=theme-color content=#041026 />
  <meta name=mobile-web-app-capable content=yes />
  <meta name=apple-mobile-web-app-capable content=yes />
  <meta name=apple-mobile-web-app-status-bar-style content=black-translucent />
  <meta name=apple-mobile-web-app-title content="壽司傳送門" />
  <link rel=icon type="image/x-icon" href="favicon.ico" />
  <link rel=icon type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel=icon type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel=apple-touch-icon sizes="180x180" href="apple-touch-icon.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #041026;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
    }

    /* 背景天空畫布 (負責四時段三色平滑漸層 + 固定種子 Random(42) 星點) */
    #sky-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Three.js WebGL 傳送門畫布 */
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 可點擊按鈕共用懸停浮起 (Hover Lift) 動畫 */
    .hover-lift {
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                  background-color 0.18s ease,
                  border-color 0.18s ease,
                  color 0.18s ease;
    }
    @media (hover: hover) {
      .hover-lift:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
      }
    }
    .hover-lift:active {
      transform: translateY(0px) scale(0.95);
    }

    /* 右上角漢堡選單容器 */
    .menu-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
    }

    /* 漢堡按鈕 */
    .hamburger-btn {
      pointer-events: auto;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 0;
    }
    .hamburger-line {
      width: 20px;
      height: 2.2px;
      background-color: #18181b;
      border-radius: 2px;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
      transform-origin: center;
    }
    .hamburger-btn.open .hamburger-line:nth-child(1) {
      transform: translateY(7.2px) rotate(45deg);
    }
    .hamburger-btn.open .hamburger-line:nth-child(2) {
      opacity: 0;
    }
    .hamburger-btn.open .hamburger-line:nth-child(3) {
      transform: translateY(-7.2px) rotate(-45deg);
    }

    /* 手風琴下拉選單 (流暢展開/收合動畫) */
    .accordion-menu {
      pointer-events: auto;
      margin-top: 10px;
      width: 288px;
      max-width: calc(100vw - 32px);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(228, 228, 231, 0.85);
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14);
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transform: translateY(-8px);
      transition: max-height 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.26s ease,
                  transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  padding 0.32s ease,
                  border-width 0.25s ease;
      border-width: 0px;
      padding: 0 14px;
    }
    .accordion-menu.open {
      max-height: 520px;
      opacity: 1;
      transform: translateY(0);
      border-width: 1.5px;
      padding: 14px;
    }

    .menu-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 11px;
      border-bottom: 1px solid rgba(228, 228, 231, 0.8);
    }
    .menu-section:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .menu-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #3f3f46;
      letter-spacing: 0.2px;
    }

    /* 項目 1：體感傾斜按鈕 */
    .ui-btn {
      width: 100%;
      appearance: none;
      border: 1.5px solid #d4d4d8;
      background: #ffffff;
      color: #18181b;
      padding: 9px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .ui-btn.active {
      background: #18181b;
      color: #ffffff;
      border-color: #18181b;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a1a1aa;
      display: inline-block;
      transition: background 0.2s ease;
    }
    .ui-btn.active .status-dot {
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }

    /* 項目 2：外環 / 內環切換 */
    .mode-switch {
      display: flex;
      background: #f4f4f5;
      border: 1.5px solid #e4e4e7;
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      appearance: none;
      border: none;
      background: transparent;
      color: #52525b;
      padding: 7px 8px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #18181b;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    /* 項目 3 & 4：拉桿 */
    .slider-val {
      color: #18181b;
      font-variant-numeric: tabular-nums;
      background: #f4f4f5;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
    }
    .ui-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #e4e4e7;
      outline: none;
      cursor: pointer;
    }
    .ui-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #18181b;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 5px rgba(0,0,0,0.28);
      transition: transform 0.15s ease;
    }
    .ui-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
    .ui-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #18181b;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 5px rgba(0,0,0,0.28);
      transition: transform 0.15s ease;
    }

    /* 項目 5：背景時段底色切換 */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .theme-btn {
      appearance: none;
      border: 1.5px solid #e4e4e7;
      background: #ffffff;
      color: #3f3f46;
      padding: 6px 2px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .theme-btn.active {
      border-color: #18181b;
      background: #18181b;
      color: #ffffff;
    }
    .theme-swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.12);
    }

    /* 進入卡片的色彩過渡遮罩層 */
    #portal-transition-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: none;
    }
    #portal-transition-overlay.blocking {
      pointer-events: auto;
    }

    /* 職人準備中提示徽章 (僅無連結網址之角色顯示，有網址之角色完全不顯示任何提示字) */
    #transition-badge {
      padding: 14px 26px;
      border-radius: 14px;
      background: rgba(24, 24, 27, 0.07);
      border: 1px solid rgba(24, 24, 27, 0.1);
      color: #18181b;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.6px;
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      display: none;
    }
    #transition-badge.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* 內嵌目標網頁容器 (確保左下角液態玻璃返回/重整按鈕在跳轉後依然常駐，且返回時能無縫播放白畫面退回傳送門動畫) */
    #subapp-frame-container {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      background: #ffffff;
    }
    #subapp-frame-container.active {
      display: block;
    }
    body.in-subapp .menu-container {
      display: none !important;
    }
    #subapp-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 需求 4：左下角微透明液態玻璃感 (Liquid Glass) 返回與重新整理圖示按鈕 */
    .bottom-left-dock {
      position: fixed;
      left: 16px;
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      z-index: 150;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .liquid-glass-btn {
      pointer-events: auto;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.55);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.38) 0%,
        rgba(255, 255, 255, 0.16) 50%,
        rgba(255, 255, 255, 0.28) 100%
      );
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.14),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.75),
        inset 0 -1px 2px rgba(0, 0, 0, 0.08);
      color: #18181b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      outline: none;
    }
    .liquid-glass-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: drop-shadow(0 1px 2px rgba(255, 255, 255, 0.6));
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .liquid-glass-btn:active svg.refresh-icon {
      transform: rotate(180deg);
    }

    .menu-section {
      transition: opacity 0.25s ease, filter 0.25s ease;
    }
    .menu-section.disabled-section {
      opacity: 0.42;
      pointer-events: none;
      filter: grayscale(0.25);
    }
  </style>
</head>
<body>
  <!-- 背景三色平滑漸層 + 固定種子星點畫布 -->
  <canvas id="sky-canvas"></canvas>

  <!-- 右上角漢堡選單與手風琴下拉面板 -->
  <div class="menu-container" id="menu-container">
    <button id="hamburger-btn" class="hamburger-btn hover-lift" type="button" aria-label="開啟設定選單">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <div id="accordion-menu" class="accordion-menu">
      <div class="menu-items">
        <!-- PWA 安裝 App 按鈕 (支援 Android 手機瀏覽器快速安裝) -->
        <div id="menu-sec-install" class="menu-section" style="display: none;">
          <button id="pwa-install-btn" class="ui-btn hover-lift" type="button" style="background: rgba(108, 166, 245, 0.18); border-color: rgba(108, 166, 245, 0.5); color: #8ab4f8; font-weight: 600;">
            <svg style="width: 15px; height: 15px; fill: currentColor; margin-right: 6px; vertical-align: -2px; display: inline-block;" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
            <span id="pwa-install-text">安裝至手機主畫面</span>
          </button>
        </div>

        <!-- 1. 開啟/關閉體感傾斜 -->
        <div class="menu-section">
          <button id="tilt-btn" class="ui-btn hover-lift" type="button">
            <span class="status-dot"></span>
            <span id="tilt-text">開啟體感傾斜</span>
          </button>
        </div>

        <!-- 2. 切換外環/內環 (預設為模式 B 內環，並自動記憶使用者選擇) -->
        <div id="menu-sec-mode" class="menu-section">
          <div class="menu-label">
            <span>圓環視角模式</span>
          </div>
          <div class="mode-switch" role="group" aria-label="圓心模式切換">
            <button id="mode-a-btn" class="mode-btn hover-lift" type="button">模式 A · 外環</button>
            <button id="mode-b-btn" class="mode-btn hover-lift active" type="button">模式 B · 內環</button>
          </div>
        </div>

        <!-- 3. 卡片數量拉桿 (預設 10 張，並自動記憶使用者設定) -->
        <div id="menu-sec-count" class="menu-section">
          <div class="menu-label">
            <span>卡片數量</span>
            <span id="card-count-val" class="slider-val">10 張</span>
          </div>
          <input id="card-count-slider" class="ui-slider" type="range" min="10" max="25" step="1" value="10" />
        </div>

        <!-- 4. 卡片間距拉桿 (自動記憶使用者設定) -->
        <div id="menu-sec-gap" class="menu-section">
          <div class="menu-label">
            <span>卡片間距</span>
            <span id="card-gap-val" class="slider-val">緊湊</span>
          </div>
          <input id="card-gap-slider" class="ui-slider" type="range" min="0" max="0.94" step="0.01" value="0.22" />
        </div>

        <!-- 5. 背景天色時段切換 (自動隨時間 / 手動指定) -->
        <div class="menu-section">
          <div class="menu-label">
            <span>背景底色時段</span>
            <span id="sky-mode-val" class="slider-val">自動</span>
          </div>
          <div class="theme-grid">
            <button class="theme-btn hover-lift active" data-theme="auto" type="button">
              <span class="theme-swatch" style="background: linear-gradient(135deg, #6CA6F5, #E5935A, #041026);"></span>
              <span>自動</span>
            </button>
            <button class="theme-btn hover-lift" data-theme="morning" type="button">
              <span class="theme-swatch" style="background: linear-gradient(180deg, #8AB4F8, #C5CAE9, #F8D7DA);"></span>
              <span>清晨</span>
            </button>
            <button class="theme-btn hover-lift" data-theme="day" type="button">
              <span class="theme-swatch" style="background: linear-gradient(180deg, #6CA6F5, #A6CBF8, #EBF3FA);"></span>
              <span>早上</span>
            </button>
            <button class="theme-btn hover-lift" data-theme="sunset" type="button">
              <span class="theme-swatch" style="background: linear-gradient(180deg, #14244C, #6E5D6E, #E5935A);"></span>
              <span>傍晚</span>
            </button>
            <button class="theme-btn hover-lift" data-theme="night" type="button">
              <span class="theme-swatch" style="background: linear-gradient(180deg, #041026, #0D2149, #254073);"></span>
              <span>晚上</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 需求 4：左下角微透明液態玻璃感 (Liquid Glass) 返回與重新整理小圖示按鈕 -->
  <div class="bottom-left-dock">
    <button id="liquid-back-btn" class="liquid-glass-btn hover-lift" type="button" title="返回" aria-label="返回">
      <svg viewBox="0 0 24 24">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <button id="liquid-refresh-btn" class="liquid-glass-btn hover-lift" type="button" title="重新整理" aria-label="重新整理">
      <svg class="refresh-icon" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <polyline points="21 3 21 9 15 9" />
      </svg>
    </button>
  </div>

  <!-- 過渡遮罩層：當角色有連結網址時僅顯示純色至全白過渡，完全不出現文字；無網址時才顯示「職人準備中...」 -->
  <div id="portal-transition-overlay">
    <div id="transition-badge">職人準備中...</div>
  </div>

  <!-- 目標網頁無縫載入區 (亦可支援直接 window.location.href 跳轉 + pageshow bfcache 自動白畫面退回動畫) -->
  <div id="subapp-frame-container">
    <iframe id="subapp-iframe" title="Target Web App" allow="accelerometer; gyroscope; autoplay; clipboard-write; encrypted-media"></iframe>
  </div>

  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ==========================================

      skyTheme: 'sushi_portal_sky_theme_v9',
      charOrder: 'sushi_portal_char_order_v12',
      tiltEnabled: 'sushi_portal_tilt_enabled_v12',
      returningFromUrl: 'sushi_portal_returning_flag_v9',
      returningCharIdx: 'sushi_portal_returning_char_v9'
    };

    const DEFAULT_CHAR_ORDER = BASE_CHARACTERS.map((_, idx) => idx);

    function parseSavedCharOrder(rawStr) {
      if (!rawStr) return [...DEFAULT_CHAR_ORDER];
      try {
        const arr = JSON.parse(rawStr);
        if (
          Array.isArray(arr) &&
          arr.length === BASE_CHARACTERS.length &&
          arr.every(n => typeof n === 'number' && n >= 0 && n < BASE_CHARACTERS.length) &&
          new Set(arr).size === BASE_CHARACTERS.length
        ) {
          return arr;
        }
      } catch (e) {}
      return [...DEFAULT_CHAR_ORDER];
    }

    function loadSavedState() {
      const savedMode = localStorage.getItem(STORAGE_KEYS.mode);
      const savedCount = parseInt(localStorage.getItem(STORAGE_KEYS.count), 10);
      const savedGap = parseFloat(localStorage.getItem(STORAGE_KEYS.gap));
      const savedStep = parseInt(localStorage.getItem(STORAGE_KEYS.stepIdx), 10);
      const savedTheme = localStorage.getItem(STORAGE_KEYS.skyTheme);
      const savedCharOrder = parseSavedCharOrder(localStorage.getItem(STORAGE_KEYS.charOrder));
      const savedTilt = localStorage.getItem(STORAGE_KEYS.tiltEnabled) === '1';

      return {
        // 模式預設為 'B' (模式 B 內環)，若使用者曾切換過則記住使用者的選擇
        mode: (savedMode === 'A' || savedMode === 'B') ? savedMode : 'B',
        // 卡片數量預設為 10 張，若使用者曾調整過則記住使用者的數量
        count: (!isNaN(savedCount) && savedCount >= 10 && savedCount <= 25) ? savedCount : 10,
        // 卡片間距若使用者曾調整過則記住使用者的間距 (預設 0.22 緊湊)
        gap: (!isNaN(savedGap) && savedGap >= 0 && savedGap <= 0.94) ? savedGap : 0.22,
        stepIdx: !isNaN(savedStep) ? savedStep : 0,
        skyTheme: savedTheme || 'auto',
        charOrder: savedCharOrder,
        tiltEnabled: savedTilt
      };
    }

    const initialState = loadSavedState();
    let characterOrder = [...initialState.charOrder];
    let tiltEnabled = initialState.tiltEnabled;

    function saveCurrentState() {
      try {
        localStorage.setItem(STORAGE_KEYS.mode, currentMode);
        localStorage.setItem(STORAGE_KEYS.count, String(numCards));
        localStorage.setItem(STORAGE_KEYS.gap, String(cardGap));
        localStorage.setItem(STORAGE_KEYS.stepIdx, String(currentStepIndex));
        localStorage.setItem(STORAGE_KEYS.skyTheme, skyThemeMode);
        localStorage.setItem(STORAGE_KEYS.charOrder, JSON.stringify(characterOrder));
        localStorage.setItem(STORAGE_KEYS.tiltEnabled, tiltEnabled ? '1' : '0');
      } catch (e) {
        console.warn('LocalStorage save note:', e);
      }
    }

    // ==========================================
    // 3. 背景四時段三色漸層 + 固定種子 Random(42) 星點系統
    // ==========================================
    const skyCanvas = document.getElementById('sky-canvas');
    const skyCtx = skyCanvas.getContext('2d');

    const SKY_PALETTES = {
      morning: {
        name: '清晨',
        top: '#8AB4F8',
        mid: '#C5CAE9',
        bottom: '#F8D7DA'
      },
      day: {
        name: '早上',
        top: '#6CA6F5',
        mid: '#A6CBF8',
        bottom: '#EBF3FA'
      },
      sunset: {
        name: '傍晚',
        top: '#14244C',
        mid: '#6E5D6E',
        bottom: '#E5935A'
      },
      night: {
        name: '晚上',
        top: '#041026',
        mid: '#0D2149',
        bottom: '#254073'
      }
    };

    function createSeededRandom(seed) {
      let s = seed >>> 0;
      return function() {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    const rng42 = createSeededRandom(42);
    const STAR_COUNT = 18;
    const FIXED_STARS = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      FIXED_STARS.push({
        nx: 0.04 + rng42() * 0.92,
        ny: 0.03 + rng42() * 0.44,
        radius: 1.0 + rng42() * 1.35,
        baseAlpha: 0.35 + rng42() * 0.45,
        twinklePhase: rng42() * Math.PI * 2,
        twinkleSpeed: 1.2 + rng42() * 1.8
      });
    }

    let skyThemeMode = initialState.skyTheme;

    function getTimeBasedThemeKey() {
      const now = new Date();
      const hr = now.getHours();
      if (hr >= 5 && hr <= 7) return 'morning';
      if (hr >= 8 && hr <= 15) return 'day';
      if (hr >= 16 && hr <= 18) return 'sunset';
      return 'night';
    }

    function hexToRgb(hex) {
      const v = parseInt(hex.replace('#', ''), 16);
      return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
    }

    function rgbToCss(rgb) {
      return `rgb(${Math.round(rgb[0])}, ${Math.round(rgb[1])}, ${Math.round(rgb[2])})`;
    }

    const activeThemeKeyInit = skyThemeMode === 'auto' ? getTimeBasedThemeKey() : skyThemeMode;
    let currentSkyRgb = {
      top: hexToRgb(SKY_PALETTES[activeThemeKeyInit].top),
      mid: hexToRgb(SKY_PALETTES[activeThemeKeyInit].mid),
      bottom: hexToRgb(SKY_PALETTES[activeThemeKeyInit].bottom)
    };
    let targetSkyRgb = {
      top: [...currentSkyRgb.top],
      mid: [...currentSkyRgb.mid],
      bottom: [...currentSkyRgb.bottom]
    };

    function updateSkyTargets() {
      const key = skyThemeMode === 'auto' ? getTimeBasedThemeKey() : skyThemeMode;
      const pal = SKY_PALETTES[key];
      targetSkyRgb.top = hexToRgb(pal.top);
      targetSkyRgb.mid = hexToRgb(pal.mid);
      targetSkyRgb.bottom = hexToRgb(pal.bottom);

      const labelEl = document.getElementById('sky-mode-val');
      if (labelEl) {
        labelEl.textContent = skyThemeMode === 'auto' ? `自動 (${pal.name})` : pal.name;
      }
    }
    updateSkyTargets();
    setInterval(updateSkyTargets, 30000);

    function resizeSkyCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      skyCanvas.width = window.innerWidth * dpr;
      skyCanvas.height = window.innerHeight * dpr;
      skyCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeSkyCanvas();

    function renderSkyBackground(dt, elapsed) {
      const lerpSpeed = Math.min(1, dt * 4.5);
      for (let i = 0; i < 3; i++) {
        currentSkyRgb.top[i] += (targetSkyRgb.top[i] - currentSkyRgb.top[i]) * lerpSpeed;
        currentSkyRgb.mid[i] += (targetSkyRgb.mid[i] - currentSkyRgb.mid[i]) * lerpSpeed;
        currentSkyRgb.bottom[i] += (targetSkyRgb.bottom[i] - currentSkyRgb.bottom[i]) * lerpSpeed;
      }

      const w = window.innerWidth;
      const h = window.innerHeight;
      const grad = skyCtx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0.0, rgbToCss(currentSkyRgb.top));
      grad.addColorStop(0.52, rgbToCss(currentSkyRgb.mid));
      grad.addColorStop(1.0, rgbToCss(currentSkyRgb.bottom));

      skyCtx.fillStyle = grad;
      skyCtx.fillRect(0, 0, w, h);

      skyCtx.save();
      for (let i = 0; i < FIXED_STARS.length; i++) {
        const st = FIXED_STARS[i];
        const sx = st.nx * w;
        const sy = st.ny * h;
        const twinkle = 0.82 + 0.18 * Math.sin(elapsed * st.twinkleSpeed + st.twinklePhase);
        const alpha = st.baseAlpha * twinkle;

        skyCtx.beginPath();
        skyCtx.fillStyle = `rgba(255, 255, 255, ${(alpha * 0.35).toFixed(3)})`;
        skyCtx.arc(sx, sy, st.radius * 2.1, 0, Math.PI * 2);
        skyCtx.fill();

        skyCtx.beginPath();
        skyCtx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
        skyCtx.arc(sx, sy, st.radius, 0, Math.PI * 2);
        skyCtx.fill();
      }
      skyCtx.restore();
    }

    // ==========================================
    // 4. Three.js Stencil Buffer 場景與渲染器初始化
    // ==========================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      stencil: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.autoClear = false;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / Math.max(1, window.innerHeight), 0.1, 150);

    const CARD_W = 1.92;
    const CARD_H = 2.78;
    const CARD_R = 0.25;
    const MAX_CARDS = Math.max(25, BASE_CHARACTERS.length);

    // 載入記憶的設定值 (預設：模式 B 內環、10 張卡片、緊湊間距)
    let currentMode = initialState.mode;
    let numCards = initialState.count;
    let cardGap = initialState.gap;
    // currentStepIndex 代表無上限的「全局步數索引」(可正可負)，確保當卡片數量 < 16 張時 (例如 10 張)，
    // 持續滑動依然能依序循環出現全部 16 隻角色！
    let currentStepIndex = initialState.stepIdx || 0;

    let angleStep = (Math.PI * 2) / numCards;
    let ringRadius = 3.4;

    function computeRingMetrics() {
      angleStep = (Math.PI * 2) / numCards;
      const chordLength = CARD_W + cardGap;
      ringRadius = chordLength / (2 * Math.sin(Math.PI / numCards));
    }
    computeRingMetrics();

    let ringRotationY = currentMode === 'A' ? (-currentStepIndex * angleStep) : (currentStepIndex * angleStep);
    let targetRingRotationY = ringRotationY;

    function createRoundedRectShape(w, h, r) {
      const s = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y);
      s.lineTo(x + w - r, y);
      s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r);
      s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h);
      s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r);
      s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }

    const portalWindowGeo = new THREE.ShapeGeometry(createRoundedRectShape(CARD_W, CARD_H, CARD_R), 40);

    // 建立卡片發光邊框幾何 (用於久按拖曳排序時醒目標示被拎起的卡片)
    function createCardBorderGeometry(w, h, r, borderThickness) {
      const outerShape = createRoundedRectShape(w + borderThickness * 2, h + borderThickness * 2, r + borderThickness * 0.8);
      const innerHole = createRoundedRectShape(w, h, r);
      outerShape.holes.push(innerHole);
      return new THREE.ShapeGeometry(outerShape, 40);
    }
    const portalBorderGeo = createCardBorderGeometry(CARD_W, CARD_H, CARD_R, 0.065);

    function createSoftShadowTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 10, 64, 64, 56);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.13)');
      grad.addColorStop(0.65, 'rgba(0, 0, 0, 0.05)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }
    const shadowTex = createSoftShadowTexture();

    // ==========================================
    // 5. 建立 3D 角色模型 + 支援動態切換角色與專屬 Stencil 空間隔離
    // ==========================================
    const CHARACTER_GEOMETRIES = BASE_CHARACTERS.map((asset) => {
      const contourShape = new THREE.Shape();
      const pts = asset.contour;
      const scaleSize = 1.42;
      contourShape.moveTo(pts[0][0] * scaleSize, pts[0][1] * scaleSize);
      for (let i = 1; i < pts.length; i++) {
        contourShape.lineTo(pts[i][0] * scaleSize, pts[i][1] * scaleSize);
      }
      contourShape.closePath();

      const extrudeDepth = 0.28;
      const extrudeSettings = {
        steps: 1,
        depth: extrudeDepth,
        bevelEnabled: true,
        bevelThickness: 0.08,
        bevelSize: 0.045,
        bevelOffset: -0.015,
        bevelSegments: 4
      };
      const bodyGeo = new THREE.ExtrudeGeometry(contourShape, extrudeSettings);
      bodyGeo.translate(0, 0, -extrudeDepth / 2);

      const posAttr = bodyGeo.attributes.position;
      const uvAttr = bodyGeo.attributes.uv;
      for (let i = 0; i < posAttr.count; i++) {
        const vx = posAttr.getX(i);
        const vy = posAttr.getY(i);
        const u = (vx / scaleSize) + 0.5;
        const v = (vy / scaleSize) + 0.5;
        uvAttr.setXY(i, Math.max(0.02, Math.min(0.98, u)), Math.max(0.02, Math.min(0.98, v)));
      }
      uvAttr.needsUpdate = true;
      return bodyGeo;
    });

    function createCharacter3D(initialCharIdx, cardIndex, stencilRefVal) {
      let currentCharIdx = initialCharIdx;
      let asset = BASE_CHARACTERS[currentCharIdx];
      let preloadedImg = PRELOADED_IMAGES[currentCharIdx];

      const charGroup = new THREE.Group();

      const applyStencil = (mat) => {
        mat.stencilWrite = true;
        mat.stencilWriteMask = 0x00;
        mat.stencilFunc = THREE.EqualStencilFunc;
        mat.stencilRef = stencilRefVal;
        mat.stencilFuncMask = 0xff;
        mat.stencilFail = THREE.KeepStencilOp;
        mat.stencilZFail = THREE.KeepStencilOp;
        mat.stencilZPass = THREE.KeepStencilOp;
        return mat;
      };

      const faceCanvas = document.createElement('canvas');
      faceCanvas.width = 512;
      faceCanvas.height = 512;
      const ctx = faceCanvas.getContext('2d');

      ctx.fillStyle = asset.sideColor;
      ctx.fillRect(0, 0, 512, 512);

      const dynamicTex = new THREE.CanvasTexture(faceCanvas);
      dynamicTex.minFilter = THREE.LinearFilter;
      dynamicTex.magFilter = THREE.LinearFilter;

      const frontMat = applyStencil(new THREE.MeshBasicMaterial({
        map: dynamicTex,
        depthTest: false,
        depthWrite: false
      }));
      const sideMat = applyStencil(new THREE.MeshBasicMaterial({
        color: new THREE.Color(asset.sideColor),
        depthTest: false,
        depthWrite: false
      }));

      const bodyMesh = new THREE.Mesh(CHARACTER_GEOMETRIES[currentCharIdx], [frontMat, sideMat]);
      charGroup.add(bodyMesh);

      const exprState = {
        mode: 'normal',
        timer: 1.0 + (cardIndex % 5) * 0.45 + Math.random() * 1.8,
        blinkProgress: 0,
        isBlinking: false,
        doubleBlink: false,
        blinkPhase: 0,
        lookX: 0,
        lookY: 0,
        targetLookX: 0,
        targetLookY: 0,
        bounceTime: 0
      };

      function setCharacterIndex(newCharIdx) {
        if (newCharIdx === currentCharIdx) return;
        currentCharIdx = newCharIdx;
        asset = BASE_CHARACTERS[currentCharIdx];
        preloadedImg = PRELOADED_IMAGES[currentCharIdx];
        bodyMesh.geometry = CHARACTER_GEOMETRIES[currentCharIdx];
        sideMat.color.set(asset.sideColor);
        drawCharacterFrame(0);
      }

      function drawCharacterFrame(elapsed) {
        if (!preloadedImg.complete || preloadedImg.naturalWidth === 0) return;
        ctx.clearRect(0, 0, 512, 512);
        ctx.drawImage(preloadedImg, 0, 0, 512, 512);

        const eyes = asset.eyes;
        ctx.save();
        ctx.fillStyle = '#08080a';
        ctx.strokeStyle = '#08080a';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        eyes.forEach((eye, idx) => {
          const ex = (eye.x + exprState.lookX * 0.018) * 512;
          const ey = (eye.y + exprState.lookY * 0.014) * 512;
          const ew = eye.w * 512;
          const eh = eye.h * 512;
          const rad = (eye.angle * Math.PI) / 180;

          ctx.save();
          ctx.translate(ex, ey);
          ctx.rotate(rad);

          if (exprState.mode === 'normal') {
            const openRatio = Math.max(0.08, 1 - exprState.blinkProgress);
            const curH = eh * openRatio;
            const r = Math.min(ew / 2, curH / 2);
            drawRoundedCapsule(ctx, -ew / 2, -curH / 2, ew, curH, r);
            ctx.fill();
          } else if (exprState.mode === 'smile') {
            ctx.lineWidth = Math.max(8, ew * 0.42);
            ctx.beginPath();
            ctx.arc(0, eh * 0.18, ew * 0.62, Math.PI * 1.12, Math.PI * 1.88, false);
            ctx.stroke();
          } else if (exprState.mode === 'frown') {
            const curH = eh * 0.82;
            const r = Math.min(ew / 2, curH / 2);
            drawRoundedCapsule(ctx, -ew / 2, -curH / 2 + 3, ew, curH, r);
            ctx.fill();
            ctx.lineWidth = Math.max(6, ew * 0.32);
            const browTilt = idx === 0 ? 0.38 : -0.38;
            ctx.save();
            ctx.translate(0, -curH / 2 - 4);
            ctx.rotate(browTilt);
            ctx.beginPath();
            ctx.moveTo(-ew * 0.65, 0);
            ctx.lineTo(ew * 0.65, 0);
            ctx.stroke();
            ctx.restore();
          } else if (exprState.mode === 'sleep') {
            ctx.lineWidth = Math.max(7, ew * 0.38);
            ctx.beginPath();
            ctx.arc(0, -eh * 0.12, ew * 0.58, Math.PI * 0.15, Math.PI * 0.85, false);
            ctx.stroke();
          } else if (exprState.mode === 'wink') {
            if (idx === 0) {
              ctx.lineWidth = Math.max(8, ew * 0.42);
              ctx.beginPath();
              ctx.moveTo(-ew * 0.55, -eh * 0.22);
              ctx.lineTo(ew * 0.5, 0);
              ctx.lineTo(-ew * 0.55, eh * 0.22);
              ctx.stroke();
            } else {
              const r = Math.min(ew / 2, eh / 2);
              drawRoundedCapsule(ctx, -ew / 2, -eh / 2, ew, eh, r);
              ctx.fill();
            }
          }
          ctx.restore();
        });

        if (exprState.mode === 'sleep') {
          const rightEye = eyes[1];
          const zx = (rightEye.x + 0.09) * 512;
          const zy = (rightEye.y - 0.08) * 512 - ((elapsed * 18) % 24);
          ctx.font = 'bold 28px sans-serif';
          ctx.fillStyle = '#18181b';
          ctx.fillText('z', zx, zy);
          ctx.font = 'bold 20px sans-serif';
          ctx.fillText('z', zx + 18, zy - 16);
        }

        ctx.restore();
        dynamicTex.needsUpdate = true;
      }

      if (preloadedImg.complete) {
        drawCharacterFrame(0);
      } else {
        preloadedImg.addEventListener('load', () => drawCharacterFrame(0), { once: true });
      }

      function drawRoundedCapsule(context, x, y, w, h, r) {
        context.beginPath();
        context.moveTo(x + r, y);
        context.lineTo(x + w - r, y);
        context.quadraticCurveTo(x + w, y, x + w, y + r);
        context.lineTo(x + w, y + h - r);
        context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        context.lineTo(x + r, y + h);
        context.quadraticCurveTo(x, y + h, x, y + h - r);
        context.lineTo(x, y + r);
        context.quadraticCurveTo(x, y, x + r, y);
        context.closePath();
      }

      function triggerRandomExpression() {
        const modes = ['normal', 'smile', 'frown', 'sleep', 'wink'];
        const next = modes[Math.floor(Math.random() * modes.length)];
        exprState.mode = next;
        exprState.timer = next === 'sleep' ? 3.2 : (1.8 + Math.random() * 2.2);
        exprState.bounceTime = 0.35;
      }

      function update(dt, elapsed) {
        exprState.timer -= dt;
        if (exprState.timer <= 0) {
          if (exprState.mode !== 'normal' || Math.random() < 0.55) {
            exprState.mode = 'normal';
            exprState.timer = 1.8 + Math.random() * 2.2;
            exprState.isBlinking = true;
            exprState.doubleBlink = Math.random() < 0.35;
            exprState.blinkPhase = 0;
            exprState.targetLookX = (Math.random() - 0.5) * 1.6;
            exprState.targetLookY = (Math.random() - 0.5) * 1.2;
          } else {
            const specials = ['smile', 'frown', 'sleep', 'wink'];
            exprState.mode = specials[Math.floor(Math.random() * specials.length)];
            exprState.timer = exprState.mode === 'sleep' ? 3.2 : 2.0;
            exprState.targetLookX = 0;
            exprState.targetLookY = 0;
          }
        }

        exprState.lookX += (exprState.targetLookX - exprState.lookX) * Math.min(1, dt * 8);
        exprState.lookY += (exprState.targetLookY - exprState.lookY) * Math.min(1, dt * 8);

        if (exprState.isBlinking) {
          exprState.blinkPhase += dt * 11;
          const p = Math.sin(exprState.blinkPhase);
          exprState.blinkProgress = Math.max(0, p);
          const maxPhase = exprState.doubleBlink ? Math.PI * 2 : Math.PI;
          if (exprState.blinkPhase >= maxPhase) {
            exprState.isBlinking = false;
            exprState.blinkProgress = 0;
          }
        } else {
          exprState.blinkProgress = 0;
        }

        charGroup.position.y = 0.06;

        let bounceScale = 1;
        if (exprState.bounceTime > 0) {
          exprState.bounceTime = Math.max(0, exprState.bounceTime - dt);
          bounceScale = 1 + Math.sin((exprState.bounceTime / 0.35) * Math.PI) * 0.07;
        }
        charGroup.scale.set(bounceScale, bounceScale, bounceScale);

        drawCharacterFrame(elapsed);
      }

      return {
        group: charGroup,
        bodyMesh,
        update,
        triggerRandomExpression,
        setCharacterIndex
      };
    }

    // ==========================================
    // 6. 預先建立 25 張卡片池 (每張卡片具備唯一 Stencil ID + 支援無限循環切換 16 隻角色與久按拖曳排序)
    // ==========================================
    const carouselGroup = new THREE.Group();
    scene.add(carouselGroup);

    const allPortalsPool = [];
    let portals = [];

    function initPortalPool() {
      for (let index = 0; index < MAX_CARDS; index++) {
        const orderPos = index % characterOrder.length;
        const charIdx = characterOrder[orderPos];
        const asset = BASE_CHARACTERS[charIdx];
        const stencilRefVal = index + 1;

        const slotGroup = new THREE.Group();
        carouselGroup.add(slotGroup);

        const maskMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(asset.bg),
          side: THREE.FrontSide,
          depthTest: true,
          depthWrite: true,
          stencilWrite: true,
          stencilWriteMask: 0xff,
          stencilFuncMask: 0xff,
          stencilRef: stencilRefVal,
          stencilFunc: THREE.AlwaysStencilFunc,
          stencilFail: THREE.KeepStencilOp,
          stencilZFail: THREE.KeepStencilOp,
          stencilZPass: THREE.ReplaceStencilOp
        });
        const maskMesh = new THREE.Mesh(portalWindowGeo, maskMat);
        maskMesh.userData = { cardIndex: index, charIdx: charIdx };
        slotGroup.add(maskMesh);

        // 久按拖曳排序時的卡片高亮外框
        const borderMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(0xffffff),
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.95,
          depthTest: true,
          depthWrite: false
        });
        const borderMesh = new THREE.Mesh(portalBorderGeo, borderMat);
        borderMesh.position.z = 0.015;
        borderMesh.visible = false;
        slotGroup.add(borderMesh);

        const backColor = new THREE.Color(asset.bg).lerp(new THREE.Color(0xf4f4f5), 0.55);
        const backMat = new THREE.MeshBasicMaterial({
          color: backColor,
          side: THREE.BackSide,
          depthTest: true,
          depthWrite: true,
          stencilWrite: true,
          stencilWriteMask: 0xff,
          stencilFuncMask: 0xff,
          stencilRef: 0,
          stencilFunc: THREE.AlwaysStencilFunc,
          stencilFail: THREE.KeepStencilOp,
          stencilZFail: THREE.KeepStencilOp,
          stencilZPass: THREE.ReplaceStencilOp
        });
        const backMesh = new THREE.Mesh(portalWindowGeo, backMat);
        slotGroup.add(backMesh);

        const interiorGroup = new THREE.Group();
        slotGroup.add(interiorGroup);

        const shadowGeo = new THREE.PlaneGeometry(1.14, 0.33);
        const shadowMat = new THREE.MeshBasicMaterial({
          map: shadowTex,
          transparent: true,
          depthTest: false,
          depthWrite: false,
          stencilWrite: true,
          stencilWriteMask: 0x00,
          stencilFunc: THREE.EqualStencilFunc,
          stencilRef: stencilRefVal,
          stencilFuncMask: 0xff,
          stencilFail: THREE.KeepStencilOp,
          stencilZFail: THREE.KeepStencilOp,
          stencilZPass: THREE.KeepStencilOp
        });
        const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
        shadowMesh.position.set(0, -0.72, -0.45);
        interiorGroup.add(shadowMesh);

        const character = createCharacter3D(charIdx, index, stencilRefVal);
        character.group.position.set(0, 0.06, -0.45);
        interiorGroup.add(character.group);

        const depthCapMat = new THREE.MeshBasicMaterial({
          colorWrite: false,
          depthWrite: true,
          depthTest: true,
          side: THREE.FrontSide
        });
        const depthCapMesh = new THREE.Mesh(portalWindowGeo, depthCapMat);
        slotGroup.add(depthCapMesh);

        const portalObj = {
          index,
          stencilRefVal,
          charIdx,
          virtualStep: index,
          asset,
          slotGroup,
          maskMesh,
          maskMat,
          borderMesh,
          borderMat,
          backMesh,
          backMat,
          interiorGroup,
          shadowMesh,
          character,
          depthCapMesh,
          floatPhase: index * 0.85,
          hoverLiftY: 0,
          hoverScale: 1,
          currentTheta: 0,
          springOffsetTheta: 0,
          currentRadiusOffset: 0,
          gridSpringOffsetX: 0,
          gridSpringOffsetY: 0,
          gridDragLiftZ: 0,
          gridStartRingTheta: 0,
          gridStartPos: new THREE.Vector3(),
          gridStartRotY: 0,
          gridStartScale: 1,
          assignCharacter(newCharIdx, vStep) {
            this.virtualStep = vStep;
            if (this.charIdx === newCharIdx) return;
            this.charIdx = newCharIdx;
            this.asset = BASE_CHARACTERS[newCharIdx];
            this.maskMat.color.set(this.asset.bg);
            const newBackColor = new THREE.Color(this.asset.bg).lerp(new THREE.Color(0xf4f4f5), 0.55);
            this.backMat.color.copy(newBackColor);
            this.maskMesh.userData.charIdx = newCharIdx;
            this.character.setCharacterIndex(newCharIdx);
          }
        };

        allPortalsPool.push(portalObj);
      }
    }
    initPortalPool();

    function normalizeAngle(rad) {
      let a = rad % (Math.PI * 2);
      if (a > Math.PI) a -= Math.PI * 2;
      if (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    // 卡片陳列模式 (4x4 陣列) 狀態控制
    const GRID_STAGGER_SEC = 0.06;
    const GRID_FLIGHT_SEC = 1.10;
    let isGridMode = false;
    let gridTransitionState = 'idle'; // 'idle' | 'entering' | 'active' | 'exiting'
    let gridTransitionElapsed = 0;

    function isGridAnimating() {
      return gridTransitionState === 'entering' || gridTransitionState === 'exiting';
    }

    // 根據使用者自訂的 characterOrder 順序與目前滑動到的全局步數，為圓環上每一張卡片動態分配對應的角色！
    function updateDynamicCharacterAssignment() {
      const totalChars = characterOrder.length; // 16 隻角色 (若未來擴充角色則自動延伸)
      if (isGridMode || gridTransitionState !== 'idle') {
        for (let i = 0; i < totalChars; i++) {
          const p = allPortalsPool[i];
          if (p) {
            p.assignCharacter(characterOrder[i], i);
          }
        }
        return;
      }

      const floatCenterStep = currentMode === 'A'
        ? (-ringRotationY / angleStep)
        : (ringRotationY / angleStep);

      for (let i = 0; i < portals.length; i++) {
        const p = portals[i];
        const k = i + numCards * Math.round((floatCenterStep - i) / numCards);
        const orderIdx = ((k % totalChars) + totalChars) % totalChars;
        const desiredCharIdx = characterOrder[orderIdx];
        p.assignCharacter(desiredCharIdx, k);
      }
    }

    function applyCardCount(targetCount) {
      numCards = targetCount;
      computeRingMetrics();
      if (isGridMode || gridTransitionState !== 'idle') {
        const totalChars = characterOrder.length;
        portals = allPortalsPool.slice(0, totalChars);
        allPortalsPool.forEach((p, idx) => {
          p.slotGroup.visible = idx < totalChars;
        });
        updateDynamicCharacterAssignment();
        return;
      }
      portals = allPortalsPool.slice(0, numCards);
      allPortalsPool.forEach((p, idx) => {
        p.slotGroup.visible = idx < numCards;
      });
      updatePortalPlacements(true);
      updateDynamicCharacterAssignment();
    }

    // ==========================================
    // 7. 模式 A (外環) / 模式 B (內環) 排列與圓心視角控制 + 4×4 卡片陳列模式座標計算
    // ==========================================
    function getSlotTargetTheta(slotIndex) {
      return currentMode === 'A'
        ? (slotIndex * angleStep)
        : (-slotIndex * angleStep + Math.PI);
    }

    function updatePortalPlacements(snapImmediately = true) {
      computeRingMetrics();
      if (isGridMode || gridTransitionState !== 'idle') return;
      portals.forEach((p, i) => {
        p.slotGroup.visible = true;
        const theta = getSlotTargetTheta(i);
        if (snapImmediately) {
          p.currentTheta = theta;
          p.springOffsetTheta = 0;
          p.currentRadiusOffset = 0;
        }
        const r = ringRadius + p.currentRadiusOffset;
        p.slotGroup.position.x = Math.sin(p.currentTheta) * r;
        p.slotGroup.position.z = Math.cos(p.currentTheta) * r;
        p.slotGroup.rotation.x = 0;
        p.slotGroup.rotation.z = 0;

        if (currentMode === 'A') {
          p.slotGroup.rotation.y = p.currentTheta;
        } else {
          p.slotGroup.rotation.y = p.currentTheta + Math.PI;
        }
      });
    }

    function getBaseCameraTransform() {
      const aspect = window.innerWidth / Math.max(1, window.innerHeight);

      const baseFov = 42;
      const vFovRadA = THREE.MathUtils.degToRad(baseFov);
      const hFovHalfA = Math.atan(Math.tan(vFovRadA / 2) * aspect);
      const referenceSpan = CARD_W * 2.22;
      const distA = Math.max(5.0, (referenceSpan * 0.5) / Math.tan(hFovHalfA));
      const halfHeightTanProduct = distA * Math.tan(vFovRadA / 2);

      if (currentMode === 'A') {
        camera.fov = baseFov;
        camera.updateProjectionMatrix();
        const camZ = ringRadius + distA;
        return { z: camZ, lookAtZ: ringRadius, viewDist: distA };
      } else {
        const camZ = 0;
        const distB = ringRadius;
        const tanHalfFovB = halfHeightTanProduct / distB;
        const vFovDegB = THREE.MathUtils.radToDeg(2 * Math.atan(tanHalfFovB));
        camera.fov = THREE.MathUtils.clamp(vFovDegB, 18, 95);
        camera.updateProjectionMatrix();
        return { z: camZ, lookAtZ: -ringRadius, viewDist: distB };
      }
    }

    // 計算卡片陳列模式 (每列最多 4 張，由上排到下、由左排到右) 的 3D 空間佈局資訊
    function getGridLayoutMetrics() {
      const baseCam = getBaseCameraTransform();
      const totalChars = characterOrder.length;
      const cols = 4;
      const rows = Math.ceil(totalChars / cols);

      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeight = 2 * baseCam.viewDist * Math.tan(vFovRad / 2);
      const visibleWidth = visibleHeight * camera.aspect;

      const gapX = CARD_W * 0.14;
      const gapY = CARD_H * 0.10;
      const totalUnscaledW = cols * CARD_W + (cols - 1) * gapX;
      const totalUnscaledH = rows * CARD_H + (rows - 1) * gapY;

      const usableW = visibleWidth * 0.86;
      const usableH = visibleHeight * 0.82;
      const cardScale = Math.min(usableW / totalUnscaledW, usableH / totalUnscaledH);

      const stepX = (CARD_W + gapX) * cardScale;
      const stepY = (CARD_H + gapY) * cardScale;
      const planeZ = baseCam.lookAtZ;

      return {
        cols,
        rows,
        totalChars,
        cardScale,
        stepX,
        stepY,
        planeZ,
        viewDist: baseCam.viewDist
      };
    }

    function getGridSlotTargetPos(gridIndex, metrics) {
      const m = metrics || getGridLayoutMetrics();
      const col = gridIndex % m.cols;
      const row = Math.floor(gridIndex / m.cols);
      const x = (col - (m.cols - 1) / 2) * m.stepX;
      const y = ((m.rows - 1) / 2 - row) * m.stepY;
      const z = m.planeZ;
      return { x, y, z, scale: m.cardScale };
    }

    // 計算第 m 張卡片 (m=0 為圓環正中央編號1，往右依序編號2,3...) 在圓環上的基準角度與位置
    function getRingSlotPoseForGridIndex(m, totalChars) {
      const halfRight = Math.floor(numCards / 2);
      const halfLeft = Math.ceil(numCards / 2) - 1;
      let stepOffset;
      let isWithinRingCount = true;

      if (m <= halfRight) {
        stepOffset = m;
      } else if (m >= totalChars - halfLeft) {
        stepOffset = m - totalChars;
      } else {
        isWithinRingCount = false;
        const extraSpan = Math.max(1, totalChars - numCards + 1);
        const extraIdx = m - halfRight;
        const frac = extraIdx / extraSpan;
        stepOffset = halfRight + frac * (numCards - halfRight - halfLeft);
      }

      const theta = currentMode === 'A'
        ? (stepOffset * angleStep)
        : (-stepOffset * angleStep + Math.PI);
      const x = Math.sin(theta) * ringRadius;
      const z = Math.cos(theta) * ringRadius;
      const rotY = currentMode === 'A' ? normalizeAngle(theta) : normalizeAngle(theta + Math.PI);

      return {
        theta,
        x,
        y: 0,
        z,
        rotY,
        isWithinRingCount
      };
    }

    const cardWorldPos = new THREE.Vector3();
    const cardWorldNormal = new THREE.Vector3();
    const camToCardVec = new THREE.Vector3();
    const tempQuat = new THREE.Quaternion();

    function renderPortalsWithStrictStencil() {
      carouselGroup.updateMatrixWorld(true);

      const renderList = [];
      for (let i = 0; i < portals.length; i++) {
        const p = portals[i];
        if (!p.slotGroup.visible) continue;
        p.slotGroup.getWorldPosition(cardWorldPos);

        const isInFrontOfLens = cardWorldPos.z < (camera.position.z - 0.15);
        if (!isInFrontOfLens) {
          p.slotGroup.visible = false;
          continue;
        }

        p.slotGroup.getWorldQuaternion(tempQuat);
        cardWorldNormal.set(0, 0, 1).applyQuaternion(tempQuat).normalize();
        camToCardVec.subVectors(camera.position, cardWorldPos);
        const distSq = camToCardVec.lengthSq();
        camToCardVec.normalize();

        const isFrontFacing = cardWorldNormal.dot(camToCardVec) > 0.0;

        renderList.push({
          portal: p,
          isFrontFacing,
          distSq
        });
        p.slotGroup.visible = false;
      }

      renderList.sort((a, b) => a.distSq - b.distSq);

      renderer.clear(true, true, true);

      // Pass 1：先一次性繪製所有卡片的「正面遮罩視窗 (maskMesh)」與「卡片背面 (backMesh)」
      for (let i = 0; i < renderList.length; i++) {
        const { portal: p, isFrontFacing } = renderList[i];
        p.slotGroup.visible = true;
        p.interiorGroup.visible = false;
        p.depthCapMesh.visible = false;
        const isBeingReordered = isReorderingCard && reorderDragState && reorderDragState.draggedPortal === p;
        p.borderMesh.visible = isBeingReordered;

        if (isFrontFacing) {
          p.maskMesh.visible = true;
          p.backMesh.visible = false;
        } else {
          p.maskMesh.visible = false;
          p.backMesh.visible = true;
        }
      }
      renderer.render(scene, camera);

      // Pass 2：在已裁切完畢的專屬 Stencil 視窗內，逐一繪製各張正面卡片內部的 3D 角色與陰影
      for (let i = 0; i < renderList.length; i++) {
        renderList[i].portal.slotGroup.visible = false;
      }

      for (let i = 0; i < renderList.length; i++) {
        const { portal: p, isFrontFacing } = renderList[i];
        if (!isFrontFacing) continue;

        p.slotGroup.visible = true;
        p.maskMesh.visible = false;
        p.backMesh.visible = false;
        p.borderMesh.visible = false;
        p.depthCapMesh.visible = false;
        p.interiorGroup.visible = true;

        renderer.render(scene, camera);

        p.slotGroup.visible = false;
      }

      // 恢復所有可見卡片與 maskMesh 狀態，供滑鼠 Raycaster 偵測點擊與懸停
      for (let i = 0; i < renderList.length; i++) {
        const { portal: p, isFrontFacing } = renderList[i];
        p.slotGroup.visible = true;
        p.maskMesh.visible = isFrontFacing;
        p.backMesh.visible = !isFrontFacing;
        p.interiorGroup.visible = isFrontFacing;
        p.depthCapMesh.visible = false;
        p.borderMesh.visible = isReorderingCard && reorderDragState && reorderDragState.draggedPortal === p;
      }
    }

    // ==========================================
    // 8. 初始化 UI 控制項狀態 (對齊 LocalStorage 記憶值與新預設值)
    // ==========================================
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const accordionMenu = document.getElementById('accordion-menu');
    const menuContainer = document.getElementById('menu-container');
    const menuSecMode = document.getElementById('menu-sec-mode');
    const menuSecCount = document.getElementById('menu-sec-count');
    const menuSecGap = document.getElementById('menu-sec-gap');
    const modeABtn = document.getElementById('mode-a-btn');
    const modeBBtn = document.getElementById('mode-b-btn');
    const countSlider = document.getElementById('card-count-slider');
    const countValEl = document.getElementById('card-count-val');
    const gapSlider = document.getElementById('card-gap-slider');
    const gapValEl = document.getElementById('card-gap-val');
    const themeBtns = document.querySelectorAll('.theme-btn');

    function setRingMenuControlsLocked(locked) {
      if (menuSecMode) menuSecMode.classList.toggle('disabled-section', locked);
      if (menuSecCount) menuSecCount.classList.toggle('disabled-section', locked);
      if (menuSecGap) menuSecGap.classList.toggle('disabled-section', locked);
      modeABtn.disabled = locked;
      modeBBtn.disabled = locked;
      countSlider.disabled = locked;
      gapSlider.disabled = locked;
    }

    function formatGapLabel(g) {
      if (g <= 0.02) return '無縫相連';
      if (g <= 0.30) return '緊湊';
      if (g <= 0.65) return '適中';
      return '最大';
    }

    function syncUIFromState() {
      modeABtn.classList.toggle('active', currentMode === 'A');
      modeBBtn.classList.toggle('active', currentMode === 'B');

      countSlider.value = String(numCards);
      countValEl.textContent = `${numCards} 張`;

      gapSlider.value = String(cardGap);
      gapValEl.textContent = formatGapLabel(cardGap);

      themeBtns.forEach((btn) => {
        btn.classList.toggle('active', btn.getAttribute('data-theme') === skyThemeMode);
      });
      updateSkyTargets();
    }

    applyCardCount(numCards);
    syncUIFromState();

    hamburgerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = accordionMenu.classList.toggle('open');
      hamburgerBtn.classList.toggle('open', isOpen);
    });

    window.addEventListener('pointerdown', (e) => {
      if (!menuContainer.contains(e.target) && accordionMenu.classList.contains('open')) {
        accordionMenu.classList.remove('open');
        hamburgerBtn.classList.remove('open');
      }
    });

    menuContainer.addEventListener('mousedown', (e) => e.stopPropagation());
    menuContainer.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });

    // 項目 2：切換外環/內環並立即記憶到 LocalStorage
    function setCircleMode(mode) {
      if (isGridMode || gridTransitionState !== 'idle' || currentMode === mode || isTransitioning) return;
      currentMode = mode;
      modeABtn.classList.toggle('active', mode === 'A');
      modeBBtn.classList.toggle('active', mode === 'B');
      updatePortalPlacements(true);

      targetRingRotationY = currentMode === 'A' ? (-currentStepIndex * angleStep) : (currentStepIndex * angleStep);
      ringRotationY = targetRingRotationY;
      updateDynamicCharacterAssignment();
      saveCurrentState();
    }

    modeABtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setCircleMode('A');
    });
    modeBBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setCircleMode('B');
    });

    // 項目 3：卡片數量拉桿並立即記憶到 LocalStorage
    countSlider.addEventListener('input', (e) => {
      if (isGridMode || gridTransitionState !== 'idle') return;
      const newCount = parseInt(e.target.value, 10);
      countValEl.textContent = `${newCount} 張`;
      if (newCount !== numCards && !isTransitioning) {
        applyCardCount(newCount);
        targetRingRotationY = currentMode === 'A' ? (-currentStepIndex * angleStep) : (currentStepIndex * angleStep);
        ringRotationY = targetRingRotationY;
        updateDynamicCharacterAssignment();
        saveCurrentState();
      }
    });

    // 項目 4：卡片間距拉桿並立即記憶到 LocalStorage
    gapSlider.addEventListener('input', (e) => {
      if (isGridMode || gridTransitionState !== 'idle') return;
      cardGap = parseFloat(e.target.value);
      gapValEl.textContent = formatGapLabel(cardGap);
      updatePortalPlacements(true);
      saveCurrentState();
    });

    // 項目 5：背景底色時段切換並記憶
    themeBtns.forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        themeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        skyThemeMode = btn.getAttribute('data-theme');
        updateSkyTargets();
        saveCurrentState();
      });
    });

    // ==========================================
    // 9. 手機體感傾斜 / 陀螺儀與滑鼠視差 (支援 LocalStorage 記憶開啟狀態)
    // ==========================================
    let sensorReceived = false;
    let sensorPermissionAttached = false;
    let tiltX = 0;
    let tiltY = 0;
    let smoothTiltX = 0;
    let smoothTiltY = 0;

    let baseGamma = null;
    let baseBeta = null;
    let baseAccX = null;
    let baseAccY = null;

    const tiltBtn = document.getElementById('tilt-btn');
    const tiltText = document.getElementById('tilt-text');

    function handleOrientation(e) {
      if (!tiltEnabled) return;
      if (e.gamma === null && e.beta === null) return;
      sensorReceived = true;

      const g = e.gamma || 0;
      const b = e.beta || 0;
      if (baseGamma === null) {
        baseGamma = g;
        baseBeta = b;
      }

      let dGamma = g - baseGamma;
      let dBeta = b - baseBeta;
      if (dGamma > 180) dGamma -= 360;
      if (dGamma < -180) dGamma += 360;

      tiltX = Math.max(-1.25, Math.min(1.25, dGamma / 20));
      tiltY = Math.max(-1.25, Math.min(1.25, dBeta / 20));
    }

    function handleMotion(e) {
      if (!tiltEnabled || sensorReceived) return;
      const acc = e.accelerationIncludingGravity;
      if (!acc || (acc.x === null && acc.y === null)) return;

      const ax = acc.x || 0;
      const ay = acc.y || 0;
      if (baseAccX === null) {
        baseAccX = ax;
        baseAccY = ay;
      }

      const dx = -(ax - baseAccX);
      const dy = (ay - baseAccY);
      tiltX = Math.max(-1.25, Math.min(1.25, dx / 3.5));
      tiltY = Math.max(-1.25, Math.min(1.25, dy / 3.5));
    }

    function attachSensorListeners() {
      if (sensorPermissionAttached) return;
      window.addEventListener('deviceorientation', handleOrientation, true);
      window.addEventListener('devicemotion', handleMotion, true);
      sensorPermissionAttached = true;
    }

    async function requestAndAttachSensors() {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const perm = await DeviceOrientationEvent.requestPermission();
          if (perm !== 'granted') {
            return false;
          }
        }
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          await DeviceMotionEvent.requestPermission().catch(() => {});
        }
      } catch (err) {
        console.warn('Sensor permission note:', err);
      }
      attachSensorListeners();
      return true;
    }

    function syncTiltUIFromState() {
      if (tiltEnabled) {
        tiltBtn.classList.add('active');
        tiltText.textContent = '體感傾斜已開啟 (0° / 0°)';
        attachSensorListeners();
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const autoWakeSensor = () => {
            if (tiltEnabled && !sensorReceived) {
              requestAndAttachSensors();
            }
          };
          window.addEventListener('touchend', autoWakeSensor, { once: true, passive: true });
          window.addEventListener('click', autoWakeSensor, { once: true, passive: true });
        }
      } else {
        tiltBtn.classList.remove('active');
        tiltText.textContent = '開啟體感傾斜';
      }
    }
    syncTiltUIFromState();

    async function toggleTiltMode() {
      if (tiltEnabled) {
        tiltEnabled = false;
        tiltX = 0;
        tiltY = 0;
        tiltBtn.classList.remove('active');
        tiltText.textContent = '開啟體感傾斜';
        saveCurrentState();
        return;
      }

      baseGamma = null;
      baseBeta = null;
      baseAccX = null;
      baseAccY = null;
      sensorReceived = false;

      const granted = await requestAndAttachSensors();
      if (!granted) {
        alert('請允許方向感測器權限以使用手機傾斜效果');
        return;
      }

      tiltEnabled = true;
      tiltBtn.classList.add('active');
      tiltText.textContent = '體感傾斜已開啟 (0° / 0°)';
      saveCurrentState();
    }

    tiltBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleTiltMode();
    });

    let hoveredCardIndex = -1;
    const hoverRaycaster = new THREE.Raycaster();
    const hoverNDC = new THREE.Vector2();
    const bottomLeftDock = document.querySelector('.bottom-left-dock');

    window.addEventListener('mousemove', (e) => {
      if (isDragging || isReorderingCard || isTransitioning || isGridAnimating()) {
        hoveredCardIndex = -1;
        return;
      }
      const nx = (e.clientX / window.innerWidth) * 2 - 1;
      const ny = (e.clientY / window.innerHeight) * 2 - 1;
      if (!tiltEnabled || !sensorReceived) {
        tiltX = nx * 0.9;
        tiltY = ny * 0.8;
      }

      if (menuContainer.contains(e.target) || bottomLeftDock.contains(e.target)) {
        hoveredCardIndex = -1;
        renderer.domElement.style.cursor = 'default';
        return;
      }

      hoverNDC.set(nx, -ny);
      hoverRaycaster.setFromCamera(hoverNDC, camera);
      const activeMasks = portals.filter(p => p.slotGroup.visible && p.maskMesh.visible).map(p => p.maskMesh);
      const hits = hoverRaycaster.intersectObjects(activeMasks, false);
      if (hits.length > 0) {
        hoveredCardIndex = hits[0].object.userData.cardIndex;
        renderer.domElement.style.cursor = 'pointer';
      } else {
        hoveredCardIndex = -1;
        renderer.domElement.style.cursor = isGridMode ? 'default' : 'grab';
      }
    });

    // ==========================================
    // 10. 卡片陳列模式 (雙指縮小發牌排好 4×4 陣列 / 雙指放大飛回圓環軌道)
    // ==========================================
    function enterGridMode() {
      if (isTransitioning || isGridMode || gridTransitionState !== 'idle') return;
      clearLongPressTimer();
      isDragging = false;
      isReorderingCard = false;
      reorderDragState = null;
      hoveredCardIndex = -1;

      const totalChars = characterOrder.length;
      // 計算畫面縮小前最中間那張卡片的全局步數，將其設為編號 1 (index 0)，往右依序為編號 2, 3...
      const centerStep = Math.round(
        currentMode === 'A' ? (-ringRotationY / angleStep) : (ringRotationY / angleStep)
      );
      const centerOrderIdx = ((centerStep % totalChars) + totalChars) % totalChars;

      const newOrder = [];
      for (let m = 0; m < totalChars; m++) {
        newOrder.push(characterOrder[(centerOrderIdx + m) % totalChars]);
      }
      characterOrder = newOrder;
      currentStepIndex = 0;
      ringRotationY = 0;
      targetRingRotationY = 0;
      carouselGroup.rotation.y = 0;
      saveCurrentState();

      isGridMode = true;
      gridTransitionState = 'entering';
      gridTransitionElapsed = 0;
      setRingMenuControlsLocked(true);

      portals = allPortalsPool.slice(0, totalChars);
      allPortalsPool.forEach((p, idx) => {
        if (idx < totalChars) {
          p.assignCharacter(characterOrder[idx], idx);
          const ringPose = getRingSlotPoseForGridIndex(idx, totalChars);
          p.gridStartRingTheta = ringPose.theta;
          p.gridStartPos.set(ringPose.x, ringPose.y, ringPose.z);
          p.gridStartRotY = ringPose.rotY;
          p.gridStartScale = 1.0;
          p.hoverLiftY = 0;
          p.hoverScale = 1.0;
          p.springOffsetTheta = 0;
          p.currentRadiusOffset = 0;
          p.gridSpringOffsetX = 0;
          p.gridSpringOffsetY = 0;
          p.gridDragLiftZ = 0;
          p.borderMesh.visible = false;

          p.slotGroup.position.set(ringPose.x, ringPose.y, ringPose.z);
          p.slotGroup.rotation.set(0, ringPose.rotY, 0);
          p.slotGroup.scale.set(1, 1, 1);
          p.slotGroup.visible = ringPose.isWithinRingCount;
        } else {
          p.slotGroup.visible = false;
        }
      });
    }

    function exitGridMode() {
      if (isTransitioning || !isGridMode || gridTransitionState !== 'active') return;
      clearLongPressTimer();
      isDragging = false;
      isReorderingCard = false;
      reorderDragState = null;
      hoveredCardIndex = -1;

      // 雙指放大回到圓環時，左上角第 1 格 (characterOrder[0]) 放回圓環正中央 (currentStepIndex = 0)
      currentStepIndex = 0;
      ringRotationY = 0;
      targetRingRotationY = 0;
      carouselGroup.rotation.y = 0;
      saveCurrentState();

      const totalChars = characterOrder.length;
      const metrics = getGridLayoutMetrics();

      allPortalsPool.forEach((p, idx) => {
        if (idx < totalChars) {
          p.assignCharacter(characterOrder[idx], idx);
          const curTarget = getGridSlotTargetPos(idx, metrics);
          p.gridStartPos.set(
            curTarget.x + p.gridSpringOffsetX,
            curTarget.y + p.gridSpringOffsetY,
            curTarget.z + p.gridDragLiftZ
          );
          p.gridStartRotY = 0;
          p.gridStartScale = curTarget.scale;
          p.gridSpringOffsetX = 0;
          p.gridSpringOffsetY = 0;
          p.gridDragLiftZ = 0;
          p.borderMesh.visible = false;
          p.slotGroup.visible = true;
        } else {
          p.slotGroup.visible = false;
        }
      });

      gridTransitionState = 'exiting';
      gridTransitionElapsed = 0;
    }

    function updateGridModePortals(dt, totalElapsed) {
      const totalChars = characterOrder.length;
      const metrics = getGridLayoutMetrics();
      const totalAnimDuration = (totalChars - 1) * GRID_STAGGER_SEC + GRID_FLIGHT_SEC;

      if (gridTransitionState === 'entering') {
        gridTransitionElapsed += dt;
        const t = gridTransitionElapsed;

        for (let m = 0; m < totalChars; m++) {
          const p = portals[m];
          const startTime = m * GRID_STAGGER_SEC;
          const rawU = (t - startTime) / GRID_FLIGHT_SEC;
          const ringPose = getRingSlotPoseForGridIndex(m, totalChars);
          const gridTarget = getGridSlotTargetPos(m, metrics);

          if (rawU <= 0) {
            p.slotGroup.visible = ringPose.isWithinRingCount;
            const waveY = Math.sin(totalElapsed * 2.2 + p.floatPhase) * 0.065;
            p.slotGroup.position.set(ringPose.x, waveY, ringPose.z);
            p.slotGroup.rotation.set(0, ringPose.rotY, 0);
            p.slotGroup.scale.set(1, 1, 1);
          } else {
            p.slotGroup.visible = true;
            const u = Math.min(1, rawU);
            // 平滑加減速飛行曲線
            const ease = u < 0.5
              ? 4 * u * u * u
              : 1 - Math.pow(-2 * u + 2, 3) / 2;

            let posX, posY, posZ;
            if (currentMode === 'B') {
              // 內環模式下沿圓弧推進至前景再展開為陣列，避免背後卡片穿過鏡頭中心
              const frontTheta = Math.PI;
              const arcTheta = THREE.MathUtils.lerp(ringPose.theta, frontTheta, Math.min(1, ease * 1.15));
              const cylX = Math.sin(arcTheta) * ringRadius;
              const cylZ = Math.cos(arcTheta) * ringRadius;
              posX = THREE.MathUtils.lerp(cylX, gridTarget.x, ease);
              posZ = THREE.MathUtils.lerp(cylZ, gridTarget.z, ease) + Math.sin(u * Math.PI) * 0.35;
              posY = THREE.MathUtils.lerp(0, gridTarget.y, ease);
            } else {
              posX = THREE.MathUtils.lerp(ringPose.x, gridTarget.x, ease);
              posY = THREE.MathUtils.lerp(ringPose.y, gridTarget.y, ease);
              posZ = THREE.MathUtils.lerp(ringPose.z, gridTarget.z, ease) + Math.sin(u * Math.PI) * 0.45;
            }

            const waveY = Math.sin(totalElapsed * 2.2 + p.floatPhase) * THREE.MathUtils.lerp(0.065, 0.018, ease);
            p.slotGroup.position.set(posX, posY + waveY, posZ);

            const rotY = THREE.MathUtils.lerp(ringPose.rotY, 0, ease);
            const bankZ = Math.sin(u * Math.PI) * -0.08;
            p.slotGroup.rotation.set(0, rotY, bankZ);

            const sc = THREE.MathUtils.lerp(1.0, gridTarget.scale, ease);
            p.slotGroup.scale.set(sc, sc, sc);
          }

          p.character.update(dt, totalElapsed);
          p.character.group.rotation.y = smoothTiltX * 0.55;
          p.character.group.rotation.x = smoothTiltY * 0.38;
          p.character.group.position.x = -smoothTiltX * 0.14;
          p.shadowMesh.position.x = -smoothTiltX * 0.10;
        }

        if (t >= totalAnimDuration) {
          gridTransitionState = 'active';
        }
        return;
      }

      if (gridTransitionState === 'exiting') {
        gridTransitionElapsed += dt;
        const t = gridTransitionElapsed;

        for (let m = 0; m < totalChars; m++) {
          const p = portals[m];
          const startTime = m * GRID_STAGGER_SEC;
          const rawU = (t - startTime) / GRID_FLIGHT_SEC;
          const ringPose = getRingSlotPoseForGridIndex(m, totalChars);

          if (rawU <= 0) {
            p.slotGroup.visible = true;
            const waveY = Math.sin(totalElapsed * 2.2 + p.floatPhase) * 0.018;
            p.slotGroup.position.set(p.gridStartPos.x, p.gridStartPos.y + waveY, p.gridStartPos.z);
            p.slotGroup.rotation.set(0, 0, 0);
            p.slotGroup.scale.set(p.gridStartScale, p.gridStartScale, p.gridStartScale);
          } else {
            const u = Math.min(1, rawU);
            const ease = u < 0.5
              ? 4 * u * u * u
              : 1 - Math.pow(-2 * u + 2, 3) / 2;

            if (!ringPose.isWithinRingCount && u > 0.88) {
              p.slotGroup.visible = false;
            } else {
              p.slotGroup.visible = true;
            }

            let posX, posY, posZ;
            if (currentMode === 'B') {
              const frontTheta = Math.PI;
              const arcTheta = THREE.MathUtils.lerp(frontTheta, ringPose.theta, ease);
              const cylX = Math.sin(arcTheta) * ringRadius;
              const cylZ = Math.cos(arcTheta) * ringRadius;
              posX = THREE.MathUtils.lerp(p.gridStartPos.x, cylX, ease);
              posZ = THREE.MathUtils.lerp(p.gridStartPos.z, cylZ, ease) + Math.sin(u * Math.PI) * 0.35;
              posY = THREE.MathUtils.lerp(p.gridStartPos.y, 0, ease);
            } else {
              posX = THREE.MathUtils.lerp(p.gridStartPos.x, ringPose.x, ease);
              posY = THREE.MathUtils.lerp(p.gridStartPos.y, ringPose.y, ease);
              posZ = THREE.MathUtils.lerp(p.gridStartPos.z, ringPose.z, ease) + Math.sin(u * Math.PI) * 0.45;
            }

            const waveY = Math.sin(totalElapsed * 2.2 + p.floatPhase) * THREE.MathUtils.lerp(0.018, 0.065, ease);
            p.slotGroup.position.set(posX, posY + waveY, posZ);

            const rotY = THREE.MathUtils.lerp(0, ringPose.rotY, ease);
            const bankZ = Math.sin(u * Math.PI) * 0.08;
            p.slotGroup.rotation.set(0, rotY, bankZ);

            const sc = THREE.MathUtils.lerp(p.gridStartScale, 1.0, ease);
            p.slotGroup.scale.set(sc, sc, sc);
          }

          p.character.update(dt, totalElapsed);
          p.character.group.rotation.y = smoothTiltX * 0.55;
          p.character.group.rotation.x = smoothTiltY * 0.38;
          p.character.group.position.x = -smoothTiltX * 0.14;
          p.shadowMesh.position.x = -smoothTiltX * 0.10;
        }

        if (t >= totalAnimDuration) {
          isGridMode = false;
          gridTransitionState = 'idle';
          currentStepIndex = 0;
          ringRotationY = 0;
          targetRingRotationY = 0;
          carouselGroup.rotation.y = 0;
          setRingMenuControlsLocked(false);
          applyCardCount(numCards);
          saveCurrentState();
        }
        return;
      }

      // gridTransitionState === 'active' (陳列模式穩定互動狀態)
      const springDecay = Math.exp(-dt * 16);
      for (let m = 0; m < totalChars; m++) {
        const p = portals[m];
        p.slotGroup.visible = true;
        const gridTarget = getGridSlotTargetPos(m, metrics);
        const isBeingDragged = isReorderingCard && reorderDragState && reorderDragState.mode === 'grid' && reorderDragState.draggedPortal === p;
        const isHovered = (p.index === hoveredCardIndex) && !isDragging && !isReorderingCard && !isTransitioning;

        p.gridSpringOffsetX *= springDecay;
        p.gridSpringOffsetY *= springDecay;
        if (Math.abs(p.gridSpringOffsetX) < 0.0003) p.gridSpringOffsetX = 0;
        if (Math.abs(p.gridSpringOffsetY) < 0.0003) p.gridSpringOffsetY = 0;

        const targetScaleMult = isBeingDragged ? 1.12 : (isHovered ? 1.05 : 1.0);
        const targetLiftZ = isBeingDragged ? 0.36 : (isHovered ? 0.08 : 0.0);
        p.hoverScale += (targetScaleMult - p.hoverScale) * Math.min(1, dt * 15);
        p.gridDragLiftZ += (targetLiftZ - p.gridDragLiftZ) * Math.min(1, dt * 15);

        const waveY = Math.sin(totalElapsed * 2.2 + p.floatPhase) * 0.018;
        if (isBeingDragged) {
          p.slotGroup.position.set(
            reorderDragState.dragWorldX,
            reorderDragState.dragWorldY,
            gridTarget.z + p.gridDragLiftZ
          );
        } else {
          p.slotGroup.position.set(
            gridTarget.x + p.gridSpringOffsetX,
            gridTarget.y + p.gridSpringOffsetY + waveY,
            gridTarget.z + p.gridDragLiftZ
          );
        }

        const wiggleZ = isBeingDragged ? Math.sin(totalElapsed * 18) * 0.045 : 0;
        p.slotGroup.rotation.set(0, 0, wiggleZ);

        const finalScale = gridTarget.scale * p.hoverScale;
        p.slotGroup.scale.set(finalScale, finalScale, finalScale);

        p.character.update(dt, totalElapsed);
        p.character.group.rotation.y = smoothTiltX * 0.55;
        p.character.group.rotation.x = smoothTiltY * 0.38;
        p.character.group.position.x = -smoothTiltX * 0.14;
        p.shadowMesh.position.x = -smoothTiltX * 0.10;
      }
    }

    // ==========================================
    // 11. 左右滑動換卡 + 搖桿式久按拖曳排序與彈簧推擠補償 (Spring Offset) + 單擊進入過渡動畫
    // ==========================================
    let isDragging = false;
    let pointerDownX = 0;
    let pointerDownY = 0;
    let currentPointerX = 0;
    let currentPointerY = 0;
    let dragStartRotation = 0;
    let totalDragDist = 0;

    // 雙指縮放手勢偵測狀態
    let pinchState = {
      active: false,
      startDist: 0,
      triggered: false
    };

    // 久按拖曳排序狀態
    const LONG_PRESS_MS = 430;
    let longPressTimer = null;
    let isReorderingCard = false;
    let reorderDragState = null;

    let isTransitioning = false;
    let renderLoopPaused = false;
    let transitionState = null;

    const overlayEl = document.getElementById('portal-transition-overlay');
    const badgeEl = document.getElementById('transition-badge');
    const subappContainer = document.getElementById('subapp-frame-container');
    const subappIframe = document.getElementById('subapp-iframe');
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();

    function clearLongPressTimer() {
      if (longPressTimer !== null) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    function pickPortalAtScreenPos(clientX, clientY) {
      pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      const visibleMasks = portals.filter(p => p.slotGroup.visible && p.maskMesh.visible).map(p => p.maskMesh);
      const hits = raycaster.intersectObjects(visibleMasks, false);
      if (hits.length === 0) return null;
      const clickedIdx = hits[0].object.userData.cardIndex;
      return allPortalsPool[clickedIdx] || null;
    }

    function screenClientToGridWorldXY(clientX, clientY, metrics) {
      const m = metrics || getGridLayoutMetrics();
      const ndcX = (clientX / window.innerWidth) * 2 - 1;
      const ndcY = -(clientY / window.innerHeight) * 2 + 1;
      const halfH = m.viewDist * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
      const halfW = halfH * camera.aspect;
      return {
        x: camera.position.x + ndcX * halfW,
        y: camera.position.y + ndcY * halfH
      };
    }

    function activateCardReorderMode(targetPortal, startX, startY) {
      if (!targetPortal || isTransitioning || isGridAnimating()) return;
      if (isGridMode && gridTransitionState !== 'active') return;

      isReorderingCard = true;
      isDragging = false;
      renderer.domElement.style.cursor = 'grabbing';

      if (navigator.vibrate) {
        try { navigator.vibrate(35); } catch (e) {}
      }

      targetPortal.character.triggerRandomExpression();

      // 陳列模式下的久按拖曳排序 (含推擠補位)
      if (isGridMode) {
        const metrics = getGridLayoutMetrics();
        const gridIdx = targetPortal.index;
        const slotPos = getGridSlotTargetPos(gridIdx, metrics);
        const pointerWorld = screenClientToGridWorldXY(startX, startY, metrics);
        const curX = slotPos.x + targetPortal.gridSpringOffsetX;
        const curY = slotPos.y + targetPortal.gridSpringOffsetY;

        reorderDragState = {
          mode: 'grid',
          draggedPortal: targetPortal,
          currentGridIndex: gridIdx,
          grabOffsetX: pointerWorld.x - curX,
          grabOffsetY: pointerWorld.y - curY,
          dragWorldX: curX,
          dragWorldY: curY
        };
        return;
      }

      // 圓環模式下的搖桿式久按拖曳排序：A 卡片固定在畫面水平原處（微幅浮起放大），底下圓環依手指偏離持續轉動
      const totalChars = characterOrder.length;
      const vStep = targetPortal.virtualStep;
      const orderIdx = ((vStep % totalChars) + totalChars) % totalChars;
      const draggedCharId = characterOrder[orderIdx];

      const floatCenterStep = currentMode === 'A'
        ? (-ringRotationY / angleStep)
        : (ringRotationY / angleStep);
      const pinnedWorldTheta = ringRotationY + targetPortal.currentTheta;
      const pinnedScreenStepOffset = vStep - floatCenterStep;

      reorderDragState = {
        mode: 'ring',
        draggedPortal: targetPortal,
