        draggedCharId,
        currentSlotIndex: targetPortal.index,
        currentVirtualStep: vStep,
        currentOrderIdx: orderIdx,
        startClientX: startX,
        startClientY: startY,
        pinnedWorldTheta,
        pinnedScreenStepOffset
      };
    }

    function onPointerDown(clientX, clientY) {
      if (isTransitioning || isGridAnimating()) return;
      if (isGridMode && gridTransitionState !== 'active') return;
      clearLongPressTimer();

      isDragging = !isGridMode;
      isReorderingCard = false;
      reorderDragState = null;

      pointerDownX = clientX;
      pointerDownY = clientY;
      currentPointerX = clientX;
      currentPointerY = clientY;
      dragStartRotation = targetRingRotationY;
      totalDragDist = 0;
      if (!isGridMode) {
        renderer.domElement.style.cursor = 'grabbing';
      }

      const pressedPortal = pickPortalAtScreenPos(clientX, clientY);
      if (pressedPortal) {
        longPressTimer = setTimeout(() => {
          longPressTimer = null;
          if (totalDragDist < 12 && !isTransitioning && !isGridAnimating() && !pinchState.active) {
            activateCardReorderMode(pressedPortal, currentPointerX, currentPointerY);
          }
        }, LONG_PRESS_MS);
      }
    }

    function onPointerMove(clientX, clientY) {
      if (isTransitioning || isGridAnimating() || pinchState.active) return;
      currentPointerX = clientX;
      currentPointerY = clientY;

      const dx = clientX - pointerDownX;
      const dy = clientY - pointerDownY;
      totalDragDist = Math.hypot(dx, dy);

      if (totalDragDist >= 12) {
        clearLongPressTimer();
      }

      // 陳列模式下的卡片拖曳排序與彈簧推擠補位
      if (isReorderingCard && reorderDragState && reorderDragState.mode === 'grid') {
        const metrics = getGridLayoutMetrics();
        const pointerWorld = screenClientToGridWorldXY(clientX, clientY, metrics);
        const dragX = pointerWorld.x - reorderDragState.grabOffsetX;
        const dragY = pointerWorld.y - reorderDragState.grabOffsetY;
        reorderDragState.dragWorldX = dragX;
        reorderDragState.dragWorldY = dragY;

        const rawCol = Math.round((dragX / metrics.stepX) + (metrics.cols - 1) / 2);
        const rawRow = Math.round(((metrics.rows - 1) / 2) - (dragY / metrics.stepY));
        const col = THREE.MathUtils.clamp(rawCol, 0, metrics.cols - 1);
        const row = THREE.MathUtils.clamp(rawRow, 0, metrics.rows - 1);
        const targetGridIdx = Math.min(metrics.totalChars - 1, row * metrics.cols + col);
        const oldGridIdx = reorderDragState.currentGridIndex;

        if (targetGridIdx !== oldGridIdx) {
          // 記錄推擠前各槽位卡片的當前視覺座標，以便賦予平滑彈簧補償
          const prevVisualXY = [];
          for (let i = 0; i < metrics.totalChars; i++) {
            const pos = getGridSlotTargetPos(i, metrics);
            prevVisualXY.push({
              x: pos.x + portals[i].gridSpringOffsetX,
              y: pos.y + portals[i].gridSpringOffsetY
            });
          }

          const oldPortal = portals[oldGridIdx];
          const savedHoverScale = oldPortal.hoverScale;
          const savedLiftZ = oldPortal.gridDragLiftZ;

          const [movedChar] = characterOrder.splice(oldGridIdx, 1);
          characterOrder.splice(targetGridIdx, 0, movedChar);

          updateDynamicCharacterAssignment();

          const stepDir = targetGridIdx > oldGridIdx ? 1 : -1;
          for (let i = oldGridIdx; i !== targetGridIdx; i += stepDir) {
            const shiftedFromIdx = i + stepDir;
            const newSlotPos = getGridSlotTargetPos(i, metrics);
            portals[i].gridSpringOffsetX = prevVisualXY[shiftedFromIdx].x - newSlotPos.x;
            portals[i].gridSpringOffsetY = prevVisualXY[shiftedFromIdx].y - newSlotPos.y;
            portals[i].hoverScale = 1.0;
            portals[i].gridDragLiftZ = 0;
          }

          const newDraggedPortal = portals[targetGridIdx];
          newDraggedPortal.gridSpringOffsetX = 0;
          newDraggedPortal.gridSpringOffsetY = 0;
          newDraggedPortal.hoverScale = savedHoverScale;
          newDraggedPortal.gridDragLiftZ = savedLiftZ;

          reorderDragState.currentGridIndex = targetGridIdx;
          reorderDragState.draggedPortal = newDraggedPortal;
          saveCurrentState();

          if (navigator.vibrate) {
            try { navigator.vibrate(15); } catch (e) {}
          }
        }
        return;
      }

      // 圓環模式下的久按拖曳排序：由 animate 迴圈根據 currentPointerX 偏離量持續驅動圓環轉動
      if (isReorderingCard && reorderDragState && reorderDragState.mode === 'ring') {
        return;
      }

      if (!isDragging || isGridMode) return;

      const sensitivity = (angleStep / (window.innerWidth * 0.25));
      const dir = currentMode === 'A' ? 1 : -1;
      targetRingRotationY = dragStartRotation + dx * sensitivity * dir;

      if (tiltEnabled && !sensorReceived) {
        tiltY = Math.max(-1, Math.min(1, dy / 140));
      }
    }

    function onPointerUp(clientX, clientY) {
      clearLongPressTimer();
      if (isTransitioning || isGridAnimating()) {
        isDragging = false;
        return;
      }

      if (isReorderingCard && reorderDragState) {
        if (reorderDragState.mode === 'ring') {
          const p = reorderDragState.draggedPortal;
          const slotIdx = reorderDragState.currentSlotIndex;
          const step = Math.round(ringRotationY / angleStep);
          targetRingRotationY = step * angleStep;
          currentStepIndex = currentMode === 'A' ? -step : step;

          if (p) {
            const slotTargetTheta = getSlotTargetTheta(slotIdx);
            p.springOffsetTheta = normalizeAngle(p.currentTheta - slotTargetTheta);
          }
        } else if (reorderDragState.mode === 'grid') {
          const p = reorderDragState.draggedPortal;
          const gridIdx = reorderDragState.currentGridIndex;
          const metrics = getGridLayoutMetrics();
          const slotPos = getGridSlotTargetPos(gridIdx, metrics);
          if (p) {
            p.gridSpringOffsetX = reorderDragState.dragWorldX - slotPos.x;
            p.gridSpringOffsetY = reorderDragState.dragWorldY - slotPos.y;
          }
        }

        isReorderingCard = false;
        reorderDragState = null;
        renderer.domElement.style.cursor = hoveredCardIndex !== -1 ? 'pointer' : (isGridMode ? 'default' : 'grab');
        saveCurrentState();
        return;
      }

      if (isGridMode) {
        if (gridTransitionState === 'active' && totalDragDist < 9 && !pinchState.active) {
          handleCardClick(clientX, clientY);
        }
        return;
      }

      if (!isDragging || isTransitioning) return;
      isDragging = false;
      renderer.domElement.style.cursor = hoveredCardIndex !== -1 ? 'pointer' : 'grab';

      const step = Math.round(targetRingRotationY / angleStep);
      targetRingRotationY = step * angleStep;
      currentStepIndex = currentMode === 'A' ? -step : step;
      saveCurrentState();

      if (totalDragDist < 9) {
        handleCardClick(clientX, clientY);
      }
    }

    function handleCardClick(clientX, clientY) {
      if (isTransitioning || isGridAnimating()) return;
      const clickedPortal = pickPortalAtScreenPos(clientX, clientY);
      if (!clickedPortal) return;

      clickedPortal.character.triggerRandomExpression();

      if (!isGridMode) {
        const clickedVirtualStep = clickedPortal.virtualStep;
        currentStepIndex = clickedVirtualStep;
        targetRingRotationY = currentMode === 'A' ? (-clickedVirtualStep * angleStep) : (clickedVirtualStep * angleStep);
        saveCurrentState();
      }

      startPortalEnterTransition(clickedPortal);
    }

    function startPortalEnterTransition(portal) {
      if (isTransitioning || isGridAnimating()) return;
      isTransitioning = true;

      const patternHex = portal.asset.patternColor;
      const startCamPos = camera.position.clone();
      const baseCam = getBaseCameraTransform();
      const targetUrl = CHARACTER_TARGET_URLS[portal.charIdx];

      let targetCamX = 0;
      let targetCamY = 0.05;
      let zoomEndZ = currentMode === 'A' ? (ringRadius + 0.55) : (-ringRadius + 0.55);
      let lookAtX = 0;
      let lookAtY = 0.05;
      let baseLookAtZ = baseCam.lookAtZ;

      if (isGridMode) {
        const metrics = getGridLayoutMetrics();
        const slotPos = getGridSlotTargetPos(portal.index, metrics);
        targetCamX = slotPos.x;
        targetCamY = slotPos.y;
        zoomEndZ = slotPos.z + Math.max(0.45, 0.55 * slotPos.scale);
        lookAtX = slotPos.x;
        lookAtY = slotPos.y;
        baseLookAtZ = slotPos.z;
      }

      transitionState = {
        portal,
        targetUrl,
        patternColor: new THREE.Color(patternHex),
        whiteColor: new THREE.Color(0xffffff),
        elapsed: 0,
        startX: startCamPos.x,
        startY: startCamPos.y,
        startZ: startCamPos.z,
        targetCamX,
        targetCamY,
        zoomEndZ,
        lookAtX,
        lookAtY,
        baseLookAtZ
      };

      overlayEl.style.opacity = '0';
      overlayEl.style.backgroundColor = patternHex;
      overlayEl.classList.add('blocking');

      badgeEl.classList.remove('visible');
      badgeEl.style.display = targetUrl ? 'none' : 'block';
    }

    function startReturnFromWhiteTransition() {
      const savedState = loadSavedState();
      currentStepIndex = savedState.stepIdx || 0;
      characterOrder = [...savedState.charOrder];
      tiltEnabled = savedState.tiltEnabled;
      syncTiltUIFromState();

      if (!isGridMode) {
        if (savedState.mode !== currentMode || savedState.count !== numCards || Math.abs(savedState.gap - cardGap) > 0.001) {
          currentMode = savedState.mode;
          cardGap = savedState.gap;
          applyCardCount(savedState.count);
          syncUIFromState();
        }

        targetRingRotationY = currentMode === 'A' ? (-currentStepIndex * angleStep) : (currentStepIndex * angleStep);
        ringRotationY = targetRingRotationY;
      }
      updateDynamicCharacterAssignment();

      const activeSlotIdx = ((currentStepIndex % numCards) + numCards) % numCards;
      const baseCam = getBaseCameraTransform();
      const zoomEndZ = currentMode === 'A' ? (ringRadius + 0.55) : (-ringRadius + 0.55);

      camera.position.set(0, 0.05, zoomEndZ);
      camera.lookAt(0, 0.05, baseCam.lookAtZ);

      overlayEl.style.backgroundColor = '#ffffff';
      overlayEl.style.opacity = '1';
      overlayEl.classList.add('blocking');
      badgeEl.classList.remove('visible');
      badgeEl.style.display = 'none';

      isTransitioning = true;
      transitionState = {
        portal: portals[activeSlotIdx] || portals[0],
        targetUrl: null,
        patternColor: new THREE.Color(0xffffff),
        whiteColor: new THREE.Color(0xffffff),
        elapsed: 2.26,
        startX: 0,
        startY: 0,
        startZ: baseCam.z,
        targetCamX: 0,
        targetCamY: 0.05,
        zoomEndZ,
        lookAtX: 0,
        lookAtY: 0.05,
        baseLookAtZ: baseCam.lookAtZ
      };

      if (renderLoopPaused) {
        renderLoopPaused = false;
        lastFrameTime = performance.now();
        requestAnimationFrame(animate);
      }
    }

    function updatePortalTransition(dt) {
      if (!transitionState) return;
      transitionState.elapsed += dt;
      const t = transitionState.elapsed;

      if (t <= 0.65) {
        const p = Math.min(1, t / 0.65);
        const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        camera.position.z = THREE.MathUtils.lerp(transitionState.startZ, transitionState.zoomEndZ, ease);
        camera.position.x = THREE.MathUtils.lerp(transitionState.startX, transitionState.targetCamX, ease);
        camera.position.y = THREE.MathUtils.lerp(transitionState.startY, transitionState.targetCamY, ease);
        const curLookX = THREE.MathUtils.lerp(0, transitionState.lookAtX, ease);
        const curLookY = THREE.MathUtils.lerp(0, transitionState.lookAtY, ease);
        camera.lookAt(curLookX, curLookY, transitionState.baseLookAtZ);

        const colorAlpha = Math.max(0, Math.min(1, (p - 0.20) / 0.72));
        overlayEl.style.backgroundColor = '#' + transitionState.patternColor.getHexString();
        overlayEl.style.opacity = colorAlpha.toFixed(3);
      }
      else if (t <= 1.25) {
        const p = Math.min(1, (t - 0.65) / 0.60);
        const easeOut = 1 - Math.pow(1 - p, 2.2);
        const mixed = transitionState.patternColor.clone().lerp(transitionState.whiteColor, easeOut);
        overlayEl.style.opacity = '1';
        overlayEl.style.backgroundColor = '#' + mixed.getHexString();
      }
      else if (t <= 2.25) {
        overlayEl.style.backgroundColor = '#ffffff';
        overlayEl.style.opacity = '1';

        const targetUrl = transitionState.targetUrl;
        if (targetUrl) {
          saveCurrentState();
          try {
            sessionStorage.setItem(STORAGE_KEYS.returningFromUrl, '1');
            sessionStorage.setItem(STORAGE_KEYS.returningCharIdx, String(transitionState.portal.charIdx));
          } catch (e) {}

          renderLoopPaused = true;
          if (USE_DIRECT_LOCATION_JUMP) {
            window.location.href = targetUrl;
          } else {
            subappIframe.src = targetUrl;
            subappContainer.classList.add('active');
            document.body.classList.add('in-subapp');
            overlayEl.style.opacity = '0';
            overlayEl.classList.remove('blocking');
            try {
              history.pushState({ inSubapp: true }, '');
            } catch (e) {}
          }
          return;
        }

        badgeEl.style.display = 'block';
        badgeEl.classList.add('visible');

        if (!renderLoopPaused) {
          renderLoopPaused = true;
          setTimeout(() => {
            renderLoopPaused = false;
            badgeEl.classList.remove('visible');
            transitionState.elapsed = 2.26;
            lastFrameTime = performance.now();
            requestAnimationFrame(animate);
          }, 850);
        }
      }
      else if (t <= 2.85) {
        const p = Math.min(1, (t - 2.26) / 0.59);
        const ease = 1 - Math.pow(1 - p, 3);
        const baseCam = getBaseCameraTransform();
        camera.position.z = THREE.MathUtils.lerp(transitionState.zoomEndZ, baseCam.z, ease);
        camera.position.x = THREE.MathUtils.lerp(transitionState.targetCamX, 0, ease);
        camera.position.y = THREE.MathUtils.lerp(transitionState.targetCamY, 0, ease);
        const curLookX = THREE.MathUtils.lerp(transitionState.lookAtX, 0, ease);
        const curLookY = THREE.MathUtils.lerp(transitionState.lookAtY, 0, ease);
        camera.lookAt(curLookX, curLookY, transitionState.baseLookAtZ);
        overlayEl.style.opacity = (1 - ease).toFixed(3);
      }
      else {
        overlayEl.style.opacity = '0';
        overlayEl.classList.remove('blocking');
        badgeEl.style.display = 'none';
        transitionState = null;
        isTransitioning = false;
      }
    }

    window.addEventListener('pageshow', (e) => {
      let isReturning = false;
      try {
        if (sessionStorage.getItem(STORAGE_KEYS.returningFromUrl) === '1') {
          isReturning = true;
          sessionStorage.removeItem(STORAGE_KEYS.returningFromUrl);
        }
      } catch (err) {}

      if (e.persisted || isReturning || renderLoopPaused) {
        startReturnFromWhiteTransition();
      }
    });

    try {
      if (sessionStorage.getItem(STORAGE_KEYS.returningFromUrl) === '1') {
        sessionStorage.removeItem(STORAGE_KEYS.returningFromUrl);
        setTimeout(() => {
          startReturnFromWhiteTransition();
        }, 30);
      }
    } catch (e) {}

    // ==========================================
    // 12. 左下角液態玻璃按鈕 (返回 & 重新整理) 互動邏輯
    // ==========================================
    const liquidBackBtn = document.getElementById('liquid-back-btn');
    const liquidRefreshBtn = document.getElementById('liquid-refresh-btn');

    function exitSubapp() {
      if (!subappContainer.classList.contains('active')) return;
      document.body.classList.remove('in-subapp');
      subappContainer.classList.remove('active');
      subappIframe.src = 'about:blank';
      startReturnFromWhiteTransition();
    }

    window.addEventListener('popstate', (e) => {
      if (subappContainer.classList.contains('active')) {
        exitSubapp();
      }
    });

    liquidBackBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (subappContainer.classList.contains('active')) {
        exitSubapp();
        if (history.state && history.state.inSubapp) {
          history.back();
        }
        return;
      }
      if (isGridAnimating()) {
        return;
      }
      if (isTransitioning) {
        startReturnFromWhiteTransition();
        return;
      }
      if (isGridMode) {
        exitGridMode();
        return;
      }
      if (window.history.length > 1 && document.referrer) {
        window.history.back();
      } else {
        currentStepIndex = 0;
        targetRingRotationY = 0;
        saveCurrentState();
        startReturnFromWhiteTransition();
      }
    });

    liquidRefreshBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      saveCurrentState();
      if (subappContainer.classList.contains('active') && subappIframe.src) {
        try {
          subappIframe.contentWindow.location.reload();
        } catch (err) {
          subappIframe.src = subappIframe.src;
        }
      } else {
        window.location.reload();
      }
    });

    // 綁定滑鼠、雙指縮放與觸控滑動事件
    const domEl = renderer.domElement;
    domEl.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', (e) => onPointerUp(e.clientX, e.clientY));

    function getTwoFingerDistance(t0, t1) {
      return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    }

    domEl.addEventListener('touchstart', (e) => {
      if (isTransitioning || isGridAnimating()) {
        clearLongPressTimer();
        isDragging = false;
        pinchState.active = false;
        pinchState.triggered = false;
        return;
      }
      if (e.touches.length === 2) {
        clearLongPressTimer();
        isDragging = false;
        if (isReorderingCard) {
          isReorderingCard = false;
          reorderDragState = null;
        }
        pinchState.active = true;
        pinchState.startDist = getTwoFingerDistance(e.touches[0], e.touches[1]);
        pinchState.triggered = false;
      } else if (e.touches.length === 1 && !pinchState.active) {
        onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
      } else {
        clearLongPressTimer();
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (isTransitioning || isGridAnimating()) {
        clearLongPressTimer();
        isDragging = false;
        pinchState.active = false;
        pinchState.triggered = false;
        return;
      }
      if (e.touches.length === 2) {
        if (!pinchState.active) {
          clearLongPressTimer();
          isDragging = false;
          pinchState.active = true;
          pinchState.startDist = getTwoFingerDistance(e.touches[0], e.touches[1]);
          pinchState.triggered = false;
          return;
        }
        if (!pinchState.triggered && pinchState.startDist > 5) {
          const curDist = getTwoFingerDistance(e.touches[0], e.touches[1]);
          const deltaDist = curDist - pinchState.startDist;
          const ratio = curDist / pinchState.startDist;

          // 雙指縮小手勢 -> 進入卡片陳列模式 (4x4 陣列)
          if (deltaDist < -26 || ratio < 0.84) {
            pinchState.triggered = true;
            enterGridMode();
          }
          // 雙指放大手勢 -> 回到圓環模式
          else if (deltaDist > 26 || ratio > 1.16) {
            pinchState.triggered = true;
            exitGridMode();
          }
        }
        return;
      }
      if (e.touches.length === 1 && !pinchState.active) {
        onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (pinchState.active) {
        if (e.touches.length === 0) {
          pinchState.active = false;
          pinchState.triggered = false;
        }
        return;
      }
      const touch = e.changedTouches[0];
      if (touch) {
        onPointerUp(touch.clientX, touch.clientY);
      } else {
        clearLongPressTimer();
      }
    });

    window.addEventListener('touchcancel', () => {
      clearLongPressTimer();
      pinchState.active = false;
      pinchState.triggered = false;
      if (isReorderingCard) {
        isReorderingCard = false;
        reorderDragState = null;
        saveCurrentState();
      }
      isDragging = false;
    });

    // 支援觸控板雙指縮放 / 滾輪縮放觸發卡片陳列模式與返回圓環模式
    domEl.addEventListener('wheel', (e) => {
      if (isTransitioning || isGridAnimating()) return;
      if (e.ctrlKey) {
        e.preventDefault();
      }
      if (e.deltaY > 18 && !isGridMode) {
        enterGridMode();
      } else if (e.deltaY < -18 && isGridMode && gridTransitionState === 'active') {
        exitGridMode();
      }
    }, { passive: false });

    window.addEventListener('resize', () => {
      resizeSkyCanvas();
      camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 13. 主渲染迴圈
    // ==========================================
    let lastFrameTime = performance.now();
    let totalElapsed = 0;

    function animate(now) {
      if (renderLoopPaused) return;
      
    // ==========================================
    // PWA Service Worker 與安裝至主畫面邏輯 (支援 Android 裝置)
    // ==========================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('[PWA] Service Worker registered:', reg.scope);
        }).catch((err) => {
          console.warn('[PWA] Service Worker registration failed:', err);
        });
      });
    }

    let deferredInstallPrompt = null;
    const installSec = document.getElementById('menu-sec-install');
    const installBtn = document.getElementById('pwa-install-btn');

    // 監聽 Android 瀏覽器 beforeinstallprompt 事件
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      if (installSec) {
        installSec.style.display = 'block';
      }
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        const { outcome } = await deferredInstallPrompt.userChoice;
        console.log('[PWA] Install prompt outcome:', outcome);
        if (outcome === 'accepted') {
          if (installSec) installSec.style.display = 'none';
        }
        deferredInstallPrompt = null;
      });
    }

    window.addEventListener('appinstalled', () => {
      console.log('[PWA] App successfully installed!');
      if (installSec) installSec.style.display = 'none';
      deferredInstallPrompt = null;
    });

    requestAnimationFrame(animate);

      const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;
      totalElapsed += dt;

      renderSkyBackground(dt, totalElapsed);

      smoothTiltX += (tiltX - smoothTiltX) * Math.min(1, dt * 9);
      smoothTiltY += (tiltY - smoothTiltY) * Math.min(1, dt * 9);

      if (tiltEnabled) {
        const degX = Math.round(smoothTiltX * 25);
        const degY = Math.round(smoothTiltY * 25);
        tiltText.textContent = `體感傾斜已開啟 (${degX}° / ${degY}°)`;
      }

      if (isGridMode || gridTransitionState !== 'idle') {
        carouselGroup.rotation.y = 0;
        updateGridModePortals(dt, totalElapsed);
      } else {
        // 需求 1 & 2：當久按拎起 A 卡片時，A 固定在畫面水平原處，手指偏離起始點如同搖桿般控制底下圓環持續轉動
        if (isReorderingCard && reorderDragState && reorderDragState.mode === 'ring') {
          const dragDx = currentPointerX - reorderDragState.startClientX;
          const deadzonePx = 10;

          if (Math.abs(dragDx) > deadzonePx) {
            const effDx = dragDx - Math.sign(dragDx) * deadzonePx;
            const maxDeflectPx = Math.max(120, Math.min(260, window.innerWidth * 0.30));
            const norm = THREE.MathUtils.clamp(effDx / maxDeflectPx, -1.6, 1.6);
            // 手指偏離越大轉越快：左偏 (norm < 0) 使圓環往右轉 (floatCenterStep 減少)，右偏使圓環往左轉
            const speedStepsPerSec = Math.sign(norm) * (0.55 * Math.abs(norm) + 2.35 * norm * norm);
            const rotDir = currentMode === 'A' ? -1 : 1;
            targetRingRotationY += speedStepsPerSec * angleStep * rotDir * dt;
            ringRotationY += (targetRingRotationY - ringRotationY) * Math.min(1, dt * 18);
          } else {
            // 手指回正則暫停轉動
            targetRingRotationY = ringRotationY;
          }

          carouselGroup.rotation.y = ringRotationY;

          // 計算拎起的 A 卡片在圓環座標系中的即時對應槽位，每當跨過相鄰 B 卡片中線時，立即更新 characterOrder 並賦予 B 彈簧推擠補償
          const floatCenterStep = currentMode === 'A'
            ? (-ringRotationY / angleStep)
            : (ringRotationY / angleStep);
          const floatingVirtualStep = floatCenterStep + reorderDragState.pinnedScreenStepOffset;
          const targetVirtualStep = Math.round(floatingVirtualStep);

          while (reorderDragState.currentVirtualStep !== targetVirtualStep) {
            const stepDir = targetVirtualStep > reorderDragState.currentVirtualStep ? 1 : -1;
            const oldVirtualStep = reorderDragState.currentVirtualStep;
            const newVirtualStep = oldVirtualStep + stepDir;

            const oldSlotIndex = ((oldVirtualStep % numCards) + numCards) % numCards;
            const newSlotIndex = ((newVirtualStep % numCards) + numCards) % numCards;

            const totalChars = characterOrder.length;
            const oldOrderIdx = ((oldVirtualStep % totalChars) + totalChars) % totalChars;
            const newOrderIdx = ((newVirtualStep % totalChars) + totalChars) % totalChars;

            const oldPortal = portals[oldSlotIndex];
            const newPortal = portals[newSlotIndex];

            // 記錄 B 卡片 (newSlotIndex) 被擠開前的圓環角度
            const prevThetaB = getSlotTargetTheta(newSlotIndex) + newPortal.springOffsetTheta;

            // 立即交換 A 與 B 在 characterOrder 中的順序
            const tempChar = characterOrder[oldOrderIdx];
            characterOrder[oldOrderIdx] = characterOrder[newOrderIdx];
            characterOrder[newOrderIdx] = tempChar;

            const savedHoverLift = oldPortal.hoverLiftY;
            const savedHoverScale = oldPortal.hoverScale;
            const savedRadiusOffset = oldPortal.currentRadiusOffset;

            // B 卡片移入 A 讓出的舊槽位 (oldSlotIndex)，賦予反向初始角度偏移 (Spring Offset)，以約 0.25s 滑入空槽
            const targetThetaForB = getSlotTargetTheta(oldSlotIndex);
            oldPortal.hoverLiftY = 0;
            oldPortal.hoverScale = 1.0;
            oldPortal.currentRadiusOffset = 0;
            oldPortal.springOffsetTheta = normalizeAngle(prevThetaB - targetThetaForB);
            oldPortal.currentTheta = targetThetaForB + oldPortal.springOffsetTheta;

            // A 卡片接手新槽位 (newSlotIndex)，保持前景浮起狀態並固定在畫面水平原處
            newPortal.hoverLiftY = savedHoverLift;
            newPortal.hoverScale = savedHoverScale;
            newPortal.currentRadiusOffset = savedRadiusOffset;
            newPortal.springOffsetTheta = 0;
            newPortal.currentTheta = reorderDragState.pinnedWorldTheta - ringRotationY;

            reorderDragState.currentVirtualStep = newVirtualStep;
            reorderDragState.currentSlotIndex = newSlotIndex;
            reorderDragState.currentOrderIdx = newOrderIdx;
            reorderDragState.draggedPortal = newPortal;

            updateDynamicCharacterAssignment();
            saveCurrentState();

            if (navigator.vibrate) {
              try { navigator.vibrate(15); } catch (e) {}
            }
          }
        } else {
          ringRotationY += (targetRingRotationY - ringRotationY) * Math.min(1, dt * 10);
          carouselGroup.rotation.y = ringRotationY;
        }

        updateDynamicCharacterAssignment();

        // 彈簧推擠補償 (Spring Offset) 減速收斂係數 (約 0.25 秒完成平滑補位)
        const springDecay = Math.exp(-dt * 16);

        portals.forEach((p, i) => {
          p.slotGroup.visible = true;
          const isBeingDragged = isReorderingCard && reorderDragState && reorderDragState.mode === 'ring' && reorderDragState.draggedPortal === p;
          const isHovered = (p.index === hoveredCardIndex) && !isDragging && !isReorderingCard && !isTransitioning;

          const targetLift = isBeingDragged ? 0.24 : (isHovered ? 0.14 : 0.0);
          const targetScale = isBeingDragged ? 1.085 : (isHovered ? 1.035 : 1.0);

          p.hoverLiftY += (targetLift - p.hoverLiftY) * Math.min(1, dt * 14);
          p.hoverScale += (targetScale - p.hoverScale) * Math.min(1, dt * 14);

          if (isBeingDragged) {
            // 拎起的 A 卡片固定在畫面水平原處
            p.springOffsetTheta = 0;
            p.currentTheta = reorderDragState.pinnedWorldTheta - ringRotationY;
          } else {
            // 非拎起卡片：槽位目標角度 + 彈簧推擠補償 (Spring Offset)
            p.springOffsetTheta *= springDecay;
            if (Math.abs(p.springOffsetTheta) < 0.0003) {
              p.springOffsetTheta = 0;
            }
            p.currentTheta = getSlotTargetTheta(i) + p.springOffsetTheta;
          }

          // 被拎起的卡片微幅向鏡頭方向浮在前景，避免與鄰卡產生 Z-fighting
          const targetRadOffset = isBeingDragged ? (currentMode === 'A' ? 0.26 : -0.26) : 0;
          p.currentRadiusOffset += (targetRadOffset - p.currentRadiusOffset) * Math.min(1, dt * 14);

          const r = ringRadius + p.currentRadiusOffset;
          p.slotGroup.position.x = Math.sin(p.currentTheta) * r;
          p.slotGroup.position.z = Math.cos(p.currentTheta) * r;

          const baseWaveY = Math.sin(totalElapsed * 2.2 + p.floatPhase) * 0.065;
          p.slotGroup.position.y = baseWaveY + p.hoverLiftY;
          p.slotGroup.scale.set(p.hoverScale, p.hoverScale, p.hoverScale);

          const wiggleZ = isBeingDragged ? Math.sin(totalElapsed * 18) * 0.045 : 0;
          p.slotGroup.rotation.x = 0;
          p.slotGroup.rotation.z = wiggleZ;
          if (currentMode === 'A') {
            p.slotGroup.rotation.y = p.currentTheta;
          } else {
            p.slotGroup.rotation.y = p.currentTheta + Math.PI;
          }

          p.character.update(dt, totalElapsed);

          p.character.group.rotation.y = smoothTiltX * 0.55;
          p.character.group.rotation.x = smoothTiltY * 0.38;
          p.character.group.position.x = -smoothTiltX * 0.14;
          p.shadowMesh.position.x = -smoothTiltX * 0.10;
        });
      }

      if (isTransitioning) {
        updatePortalTransition(dt);
      } else {
        const baseCam = getBaseCameraTransform();
        const tiltMult = isGridMode ? 0.25 : 1.0;
        const targetCamX = smoothTiltX * 0.65 * tiltMult;
        const targetCamY = -smoothTiltY * 0.48 * tiltMult;
        camera.position.x += (targetCamX - camera.position.x) * Math.min(1, dt * 12);
        camera.position.y += (targetCamY - camera.position.y) * Math.min(1, dt * 12);
        camera.position.z += (baseCam.z - camera.position.z) * Math.min(1, dt * 12);
        camera.lookAt(0, 0, baseCam.lookAtZ);
      }

      renderPortalsWithStrictStencil();
    }

    
    // ==========================================
    // PWA Service Worker 與安裝至主畫面邏輯 (支援 Android 裝置)
    // ==========================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('[PWA] Service Worker registered:', reg.scope);
        }).catch((err) => {
          console.warn('[PWA] Service Worker registration failed:', err);
        });
      });
    }

    let deferredInstallPrompt = null;
    const installSec = document.getElementById('menu-sec-install');
    const installBtn = document.getElementById('pwa-install-btn');

    // 監聽 Android 瀏覽器 beforeinstallprompt 事件
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      if (installSec) {
        installSec.style.display = 'block';
      }
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        const { outcome } = await deferredInstallPrompt.userChoice;
        console.log('[PWA] Install prompt outcome:', outcome);
        if (outcome === 'accepted') {
          if (installSec) installSec.style.display = 'none';
        }
        deferredInstallPrompt = null;
      });
    }

    window.addEventListener('appinstalled', () => {
      console.log('[PWA] App successfully installed!');
      if (installSec) installSec.style.display = 'none';
      deferredInstallPrompt = null;
    });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
